<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Network Lab</title>
    <style>
        *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
        html,body{width:100%;height:100%;overflow:hidden;background:#0D1117;font-family:system-ui,sans-serif}
        body{display:flex;flex-direction:column}
        .topbar{background:#161B22;padding:32px 14px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #21262D;flex-shrink:0}
        .back-btn{background:#21262D;border:none;color:#7EDCFF;font-size:13px;padding:6px 14px;border-radius:8px;cursor:pointer}
        .title{color:#fff;font-size:14px;font-weight:600;flex:1}
        .replay-btn{background:#1F6FEB;border:none;color:#fff;font-size:12px;padding:6px 14px;border-radius:8px;cursor:pointer;font-weight:600}
        .canvas-wrap{flex:1;position:relative;overflow:hidden}
        #canvas{display:block;touch-action:none}
        .info-bar{background:#161B22;border-top:1px solid #21262D;padding:10px 14px 60px;display:flex;align-items:center;gap:10px;flex-shrink:0}
        .info-icon{font-size:20px}
        .info-text{flex:1}
        .info-title{color:#fff;font-size:12px;font-weight:600;margin-bottom:2px}
        .info-sub{color:#8FA5C3;font-size:11px;line-height:1.4}
    </style>
</head>
<body>
<div class="topbar" id="topbar">
    <button class="back-btn" onclick="goBack()">← Back</button>
    <span class="title">🌐 Full Network — Data Flow</span>
    <button class="replay-btn" onclick="startJourney()">▶ Replay</button>
</div>
<div class="canvas-wrap">
    <canvas id="canvas"></canvas>
</div>
<div class="info-bar" id="infobar">
    <span class="info-icon" id="infoIcon">🌐</span>
    <div class="info-text">
        <div class="info-title" id="infoTitle">Full Network Lab</div>
        <div class="info-sub" id="infoSub">Watch data flow through all 8 network devices. Tap any device to learn about it.</div>
    </div>
</div>

<script>
    const canvas=document.getElementById('canvas');
    const ctx=canvas.getContext('2d');

    let W=0,H=0,nodes={},animT=0;
    let packets=[],activeNode=null,journeyRunning=false;

    function resize(){
      const th=document.getElementById('topbar').getBoundingClientRect().height;
      const ih=document.getElementById('infobar').getBoundingClientRect().height;
      W=canvas.width=window.innerWidth;
      H=canvas.height=Math.max(100,window.innerHeight-th-ih);
      buildNodes();
      draw();
    }

    function buildNodes(){
      const cx=W/2;
      nodes={
        internet: {x:cx,         y:H*0.04, type:'internet', label:'Internet',     color:'#58A6FF', info:'The global internet. Source of all external traffic and data.'},
        gateway:  {x:cx,         y:H*0.14, type:'gateway',  label:'Gateway',      color:'#B060FF', info:'Translates protocols between different networks. Entry point between WAN and LAN.'},
        firewall: {x:cx,         y:H*0.25, type:'firewall', label:'Firewall',     color:'#F85149', info:'Inspects every packet. Blocks threats, allows legitimate traffic. Layer 3–7.'},
        router:   {x:cx,         y:H*0.36, type:'router',   label:'Router',       color:'#1F6FEB', info:'Routes packets between networks using IP addresses. Layer 3 (Network).'},
        sw:       {x:cx,         y:H*0.50, type:'switch',   label:'Switch',       color:'#3EC26E', info:'Forwards frames to correct port using MAC address table. Layer 2 (Data Link).'},
        wap:      {x:cx-W*0.32,  y:H*0.65, type:'wap',      label:'Access Point', color:'#0F9E70', info:'Broadcasts Wi-Fi SSID. Bridges wireless clients to the wired LAN. Layer 2.'},
        hub:      {x:cx,         y:H*0.65, type:'hub',      label:'Hub',          color:'#C07020', info:'Broadcasts ALL data to every port. No filtering — shared collision domain. Layer 1.'},
        repeater: {x:cx+W*0.32,  y:H*0.65, type:'repeater', label:'Repeater',    color:'#388BFD', info:'Regenerates and amplifies weak signals to extend the network range. Layer 1.'},
        laptop:   {x:cx-W*0.38,  y:H*0.86, type:'end',      label:'Laptop',      color:'#7EDCFF', info:'Wireless client. NIC converts digital data to Wi-Fi signals for transmission.'},
        phone:    {x:cx-W*0.24,  y:H*0.86, type:'end',      label:'Phone',       color:'#B060FF', info:'Mobile wireless client. NIC inside connects via Wi-Fi 2.4GHz or 5GHz band.'},
        pc1:      {x:cx-W*0.08,  y:H*0.86, type:'end',      label:'PC 1',        color:'#7EDCFF', info:'Wired client. NIC (Network Interface Card) provides unique MAC address for LAN communication.'},
        pc2:      {x:cx+W*0.08,  y:H*0.86, type:'end',      label:'PC 2',        color:'#7EDCFF', info:'Wired client. NIC operates at Layer 2 — encodes data into Ethernet frames for the Hub.'},
        pc3:      {x:cx+W*0.32,  y:H*0.86, type:'end',      label:'PC 3',        color:'#388BFD', info:'Extended range client. NIC receives the amplified signal regenerated by the Repeater.'},
      };
    }

    // ── Connections ──────────────────────────────────────────────────────────────
    const EDGES=[
      ['internet','gateway'],['gateway','firewall'],['firewall','router'],['router','sw'],
      ['sw','wap'],['sw','hub'],['sw','repeater'],
      ['wap','laptop'],['wap','phone'],
      ['hub','pc1'],['hub','pc2'],
      ['repeater','pc3'],
    ];

    // ── Segment colours ───────────────────────────────────────────────────────────
    function edgeColor(a,b){
      if(a==='internet'||b==='internet') return'#58A6FF55';
      if(a==='gateway'||b==='gateway')   return'#B060FF55';
      if(a==='firewall'||b==='firewall') return'#F8514955';
      if(a==='router'||b==='router')     return'#1F6FEB55';
      if(a==='wap'||b==='wap')           return'#0F9E7055';
      if(a==='hub'||b==='hub')           return'#C0702055';
      if(a==='repeater'||b==='repeater') return'#388BFD55';
      return'#3EC26E55';
    }

    // ── Draw helpers ──────────────────────────────────────────────────────────────
    function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.arcTo(x+w,y,x+w,y+r,r);c.lineTo(x+w,y+h-r);c.arcTo(x+w,y+h,x+w-r,y+h,r);c.lineTo(x+r,y+h);c.arcTo(x,y+h,x,y+h-r,r);c.lineTo(x,y+r);c.arcTo(x,y,x+r,y,r);c.closePath();}

    const SC=1.1;
    function drawNode(id){
      const n=nodes[id];if(!n)return;
      const isActive=activeNode===id;
      const t=animT;
      ctx.save();ctx.translate(n.x,n.y);ctx.scale(SC,SC);

      if(isActive){
        ctx.save();ctx.strokeStyle=n.color;ctx.lineWidth=2;ctx.globalAlpha=0.5+0.3*Math.sin(t*8);
        ctx.setLineDash([4,3]);ctx.beginPath();ctx.arc(0,0,28,0,Math.PI*2);ctx.stroke();
        ctx.setLineDash([]);ctx.globalAlpha=1;ctx.restore();
      }

      switch(n.type){
        case 'internet':
          ctx.fillStyle='#C8D8E8';
          ctx.beginPath();ctx.arc(-10,-4,10,0,Math.PI*2);ctx.arc(4,-8,12,0,Math.PI*2);
          ctx.arc(14,-2,9,0,Math.PI*2);ctx.arc(0,3,7,0,Math.PI*2);ctx.arc(-14,1,7,0,Math.PI*2);ctx.fill();
          ctx.fillStyle='#1A2744';ctx.font='bold 6px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('WWW',2,-2);
          break;
        case 'gateway':
          ctx.fillStyle='#4A1070';rr(ctx,-14,-20,28,40,2);ctx.fill();
          ctx.fillStyle='#B060FF';rr(ctx,-12,-18,24,36,2);ctx.fill();
          ctx.fillStyle='#4A1070';
          for(let r2=-2;r2<=2;r2++){const off=(r2%2===0)?0:6;for(let c=-1;c<=1;c++){const bx=-12+c*12+off,by=r2*6-3;if(bx>=-12&&bx+10<=12){rr(ctx,bx,by,10,5,1);ctx.fill();}}}
          break;
        case 'firewall':
          ctx.fillStyle='#6B0A0A';rr(ctx,-14,-22,28,44,2);ctx.fill();
          ctx.fillStyle='#C03030';rr(ctx,-12,-20,24,40,2);ctx.fill();
          ctx.fillStyle='#6B0A0A';
          for(let row=-3;row<=2;row++){const off=(row%2===0)?0:6;for(let col=-1;col<=0;col++){const bx=-12+col*12+off,by=row*6-2;if(bx>=-12&&bx+10<=12){rr(ctx,bx,by,10,5,1);ctx.fill();}}}
          ctx.fillStyle='rgba(255,255,255,0.5)';
          ctx.beginPath();ctx.moveTo(0,-6);ctx.lineTo(-5,-3);ctx.lineTo(-5,2);ctx.quadraticCurveTo(-5,7,0,10);ctx.quadraticCurveTo(5,7,5,2);ctx.lineTo(5,-3);ctx.closePath();ctx.fill();
          break;
        case 'router':
          ctx.fillStyle='#0D2850';rr(ctx,-18,-10,36,20,3);ctx.fill();
          ctx.fillStyle='#1A5FAD';rr(ctx,-16,-8,32,16,2);ctx.fill();
          ctx.fillStyle='#2A82D4';ctx.beginPath();ctx.moveTo(-16,-8);ctx.lineTo(-12,-15);ctx.lineTo(20,-15);ctx.lineTo(16,-8);ctx.closePath();ctx.fill();
          for(let i=0;i<3;i++){ctx.strokeStyle='#7ECDF5';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(-6+i*6,-8);ctx.lineTo(-7+i*6,-17);ctx.stroke();}
          for(let i=0;i<3;i++){ctx.fillStyle='#061828';rr(ctx,-10+i*7,-1,5,4,1);ctx.fill();ctx.fillStyle='#00FF88';ctx.beginPath();ctx.arc(-8+i*7,1,1.2,0,Math.PI*2);ctx.fill();}
          break;
        case 'switch':
          ctx.fillStyle='#0D2010';rr(ctx,-22,-9,44,18,3);ctx.fill();
          ctx.fillStyle='#2A6B20';rr(ctx,-20,-7,40,14,2);ctx.fill();
          for(let i=0;i<7;i++){ctx.fillStyle='#0D1A0D';rr(ctx,-17+i*5,-4,4,4,1);ctx.fill();ctx.fillStyle=i<5?'#00FF88':'#333';ctx.beginPath();ctx.arc(-15+i*5,-2,1.2,0,Math.PI*2);ctx.fill();}
          break;
        case 'wap':
          ctx.fillStyle='#063C28';ctx.beginPath();ctx.ellipse(0,5,16,5,0,0,Math.PI*2);ctx.fill();
          ctx.fillStyle='#14A070';ctx.beginPath();ctx.ellipse(0,0,14,4,0,0,Math.PI*2);ctx.fill();
          ctx.strokeStyle='#0A3020';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(0,-4);ctx.lineTo(0,-16);ctx.stroke();
          ctx.fillStyle='#20D090';ctx.beginPath();ctx.arc(0,-16,2.5,0,Math.PI*2);ctx.fill();
          ctx.fillStyle='#00FF88';ctx.beginPath();ctx.arc(6,0,1.5,0,Math.PI*2);ctx.fill();
          break;
        case 'hub':
          ctx.fillStyle='#3A2008';rr(ctx,-20,-8,40,16,2);ctx.fill();
          ctx.fillStyle='#6A3810';rr(ctx,-18,-6,36,12,2);ctx.fill();
          ctx.fillStyle='#8A5020';ctx.beginPath();ctx.moveTo(-18,-6);ctx.lineTo(-14,-12);ctx.lineTo(22,-12);ctx.lineTo(18,-6);ctx.closePath();ctx.fill();
          for(let i=0;i<7;i++){ctx.fillStyle='#1A0C04';rr(ctx,-16+i*5,-3,4,3,1);ctx.fill();ctx.fillStyle='#FFD040';ctx.beginPath();ctx.arc(-14+i*5,-1.5,1,0,Math.PI*2);ctx.fill();}
          break;
        case 'repeater':
          ctx.fillStyle='#1A4A7A';rr(ctx,-20,-10,40,20,3);ctx.fill();
          ctx.fillStyle='#1F6FEB';rr(ctx,-18,-8,36,16,2);ctx.fill();
          for(let i=0;i<3;i++){ctx.fillStyle='#0D2040';rr(ctx,-12+i*9,-4,7,4,1);ctx.fill();ctx.fillStyle='#00FF88';ctx.beginPath();ctx.arc(-9+i*9,-2,1.5,0,Math.PI*2);ctx.fill();}
          break;
        case 'end':
          // PC/Laptop/Phone with NIC indicator
          ctx.fillStyle='#1A2060';rr(ctx,-14,-18,28,22,2);ctx.fill();
          ctx.fillStyle='#4A6AE0';rr(ctx,-12,-16,24,16,1);ctx.fill();
          ctx.fillStyle='rgba(120,160,255,0.5)';for(let i=0;i<2;i++){rr(ctx,-9,-13+i*6,18,3,1);ctx.fill();}
          ctx.fillStyle='#1A2060';rr(ctx,-2,4,4,5,1);ctx.fill();rr(ctx,-7,9,14,3,1);ctx.fill();
          // NIC indicator (green strip at bottom)
          ctx.fillStyle='#00FF4488';rr(ctx,-14,11,28,5,2);ctx.fill();
          ctx.fillStyle='#00FF88';ctx.font='bold 4px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('NIC',0,13.5);
          break;
      }
      ctx.restore();

      // Label
      ctx.save();
      ctx.font=`bold ${isActive?10:9}px system-ui`;ctx.textAlign='center';
      const lbl=n.label;const tw=ctx.measureText(lbl).width;
      const ly=n.y+22*SC+6;
      ctx.fillStyle='rgba(8,14,28,0.92)';rr(ctx,n.x-tw/2-5,ly-8,tw+10,16,3);ctx.fill();
      ctx.strokeStyle=isActive?n.color:'#30363D';ctx.lineWidth=1;ctx.stroke();
      ctx.fillStyle=isActive?n.color:'#C9D1D9';ctx.textBaseline='middle';ctx.fillText(lbl,n.x,ly);
      ctx.restore();
    }

    // ── Packets ───────────────────────────────────────────────────────────────────
    let pkts=[];

    function spawnPkt(fromId,toId,color,delay){
      const from=nodes[fromId],to=nodes[toId];if(!from||!to)return;
      setTimeout(()=>{
        pkts.push({x:from.x,y:from.y,tx:to.x,ty:to.y,color,progress:0,speed:0.018,fromId,toId});
      },delay);
    }

    // ── Journey sequence ──────────────────────────────────────────────────────────
    const JOURNEY=[
      {from:'internet',to:'gateway',  color:'#58A6FF',delay:0,    icon:'☁️', title:'Step 1 — Internet',    info:'Data originates on the Internet and travels to the Gateway for protocol translation.'},
      {from:'gateway', to:'firewall', color:'#B060FF',delay:1800, icon:'🌐', title:'Step 2 — Gateway',     info:'Gateway translates protocols between WAN and LAN. Data enters the internal network.'},
      {from:'firewall',to:'router',   color:'#F85149',delay:3600, icon:'🛡️', title:'Step 3 — Firewall',   info:'Firewall inspects the packet against security rules. Threats are blocked here (Layer 3–7).'},
      {from:'router',  to:'sw',       color:'#1F6FEB',delay:5400, icon:'🔀', title:'Step 4 — Router',      info:'Router checks its routing table and forwards the packet to the correct network segment (Layer 3).'},
      {from:'sw',      to:'wap',      color:'#3EC26E',delay:7200, icon:'🔌', title:'Step 5 — Switch',      info:'Switch reads the MAC address and forwards the frame to the correct port only (Layer 2).'},
      {from:'sw',      to:'hub',      color:'#3EC26E',delay:7200, icon:'🔌', title:'Step 5 — Switch',      info:'Switch forwards frames to WAP, Hub and Repeater segments simultaneously.'},
      {from:'sw',      to:'repeater', color:'#3EC26E',delay:7200, icon:'🔌', title:'Step 5 — Switch',      info:'Switch distributes to all three network segments: wireless, hub, and extended range.'},
      {from:'wap',     to:'laptop',   color:'#0F9E70',delay:9000, icon:'📶', title:'Step 6 — Access Point',info:'Access Point broadcasts Wi-Fi. Laptop NIC receives the wireless signal and decodes it.'},
      {from:'wap',     to:'phone',    color:'#0F9E70',delay:9000, icon:'📶', title:'Step 6 — Access Point',info:'Phone NIC connects wirelessly. WAP bridges Wi-Fi to the wired LAN (Layer 2).'},
      {from:'hub',     to:'pc1',      color:'#FFB300',delay:9200, icon:'📡', title:'Step 6 — Hub',         info:'Hub broadcasts to ALL ports! PC 1 NIC receives the frame — even if not the intended recipient.'},
      {from:'hub',     to:'pc2',      color:'#FFB300',delay:9200, icon:'📡', title:'Step 6 — Hub',         info:'PC 2 NIC also receives the data. Hub creates a shared collision domain — unlike a Switch.'},
      {from:'repeater',to:'pc3',      color:'#388BFD',delay:9400, icon:'🔁', title:'Step 6 — Repeater',    info:'Repeater regenerates the weakened signal. PC 3 NIC receives a clean amplified signal.'},
    ];

    let journeyIdx=0;
    function startJourney(){
      pkts=[];activeNode=null;journeyRunning=true;journeyIdx=0;
      setInfo('🌐','Starting data flow...','Watch data travel through all 8 network devices from Internet to every end device.');
      JOURNEY.forEach((step,i)=>{
        spawnPkt(step.from,step.to,step.color,step.delay);
        // Update info at each major step
        setTimeout(()=>{
          activeNode=step.from;
          setInfo(step.icon,step.title,step.info);
        },step.delay+200);
      });
      // Final message
      setTimeout(()=>{
        activeNode=null;journeyRunning=false;
        setInfo('✅','Data delivered!','All 8 devices worked together: Gateway → Firewall → Router → Switch → WAP/Hub/Repeater → NICs. Tap ▶ Replay to watch again.');
      },12000);
    }

    // ── Main draw ─────────────────────────────────────────────────────────────────
    function draw(){
      if(!W||!H)return;
      ctx.clearRect(0,0,W,H);
      ctx.fillStyle='rgba(100,140,200,0.06)';
      for(let x=20;x<W;x+=30)for(let y=20;y<H;y+=30){ctx.beginPath();ctx.arc(x,y,1.2,0,Math.PI*2);ctx.fill();}

      // Edges
      EDGES.forEach(([a,b])=>{
        const na=nodes[a],nb=nodes[b];if(!na||!nb)return;
        const dx=nb.x-na.x,dy=nb.y-na.y,len=Math.sqrt(dx*dx+dy*dy);if(len<1)return;
        const ux=dx/len,uy=dy/len,g=24;
        ctx.save();ctx.strokeStyle=edgeColor(a,b);ctx.lineWidth=2;
        ctx.beginPath();ctx.moveTo(na.x+ux*g,na.y+uy*g);ctx.lineTo(nb.x-ux*g,nb.y-uy*g);ctx.stroke();
        ctx.restore();
      });

      // Packets
      pkts=pkts.filter(p=>{
        p.progress+=p.speed;
        const px=p.x+(p.tx-p.x)*p.progress,py=p.y+(p.ty-p.y)*p.progress;
        ctx.beginPath();ctx.arc(px,py,5,0,Math.PI*2);ctx.fillStyle=p.color;ctx.fill();
        ctx.strokeStyle='rgba(255,255,255,0.6)';ctx.lineWidth=1.2;ctx.stroke();
        return p.progress<1;
      });

      // Nodes (drawn on top of packets)
      Object.keys(nodes).forEach(id=>drawNode(id));

      // Wi-Fi rings around WAP
      if(nodes.wap){
        const ap=nodes.wap;
        [0.3,0.6,0.9].forEach(ph=>{
          const p=(animT*0.3+ph)%1;
          ctx.save();ctx.strokeStyle=`rgba(15,158,112,${Math.max(0,(1-p)*0.3)})`;ctx.lineWidth=1.5;
          ctx.beginPath();ctx.arc(ap.x,ap.y,20+p*60,0,Math.PI*2);ctx.stroke();ctx.restore();
        });
      }

      // Hub broadcast rings when packets flow
      const hubPkt=pkts.find(p=>p.fromId==='hub');
      if(hubPkt&&nodes.hub){
        const hub=nodes.hub;
        ctx.save();ctx.strokeStyle=`rgba(192,112,32,${0.4*(1-hubPkt.progress)})`;
        ctx.lineWidth=1.5;ctx.setLineDash([4,3]);
        ctx.beginPath();ctx.arc(hub.x,hub.y,hubPkt.progress*60,0,Math.PI*2);ctx.stroke();
        ctx.setLineDash([]);ctx.restore();
      }

      // Signal wave on repeater cable
      const repPkt=pkts.find(p=>p.fromId==='repeater');
      if(repPkt&&nodes.repeater&&nodes.pc3){
        const rep=nodes.repeater,pc=nodes.pc3;
        const mx=(rep.x+pc.x)/2,my=(rep.y+pc.y)/2-28;
        ctx.save();ctx.fillStyle='rgba(8,14,28,0.9)';rr(ctx,mx-38,my-10,76,20,5);ctx.fill();
        ctx.strokeStyle='#388BFD44';ctx.lineWidth=1;ctx.stroke();
        ctx.fillStyle='#388BFD';ctx.font='bold 8px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillText('🔁 Amplified Signal',mx,my);ctx.restore();
      }
    }

    function animate(){animT+=0.016;draw();requestAnimationFrame(animate);}
    animate();

    // ── Touch ─────────────────────────────────────────────────────────────────────
    function cp(e){const r=canvas.getBoundingClientRect(),s=e.changedTouches?e.changedTouches[0]:e.touches?e.touches[0]:e;return{x:(s.clientX-r.left)*(W/r.width),y:(s.clientY-r.top)*(H/r.height)};}
    function hitNode(x,y){return Object.entries(nodes).find(([id,n])=>Math.hypot(x-n.x,y-n.y)<28);}

    canvas.addEventListener('click',e=>{
      const{x,y}=cp(e);
      const hit=hitNode(x,y);
      if(hit){const[id,n]=hit;activeNode=id;setInfo(n.label==='Internet'?'☁️':n.label==='Gateway'?'🌐':n.label==='Firewall'?'🛡️':n.label==='Router'?'🔀':n.label==='Switch'?'🔌':n.label==='Access Point'?'📶':n.label==='Hub'?'📡':n.label==='Repeater'?'🔁':'💾',n.label,n.info);}
      else{activeNode=null;setInfo('🌐','Full Network Lab','Tap any device to learn about it. Tap ▶ Replay to watch the full data journey again.');}
    });
    canvas.addEventListener('touchstart',e=>{e.preventDefault();const{x,y}=cp(e);const hit=hitNode(x,y);if(hit){const[id,n]=hit;activeNode=id;setInfo(n.label==='Internet'?'☁️':n.label==='Gateway'?'🌐':n.label==='Firewall'?'🛡️':n.label==='Router'?'🔀':n.label==='Switch'?'🔌':n.label==='Access Point'?'📶':n.label==='Hub'?'📡':n.label==='Repeater'?'🔁':'💾',n.label,n.info);}else{activeNode=null;}},{passive:false});

    function setInfo(icon,title,sub){document.getElementById('infoIcon').textContent=icon;document.getElementById('infoTitle').textContent=title;document.getElementById('infoSub').textContent=sub;}
    function goBack(){if(window.AndroidBridge)AndroidBridge.goBack();else history.back();}

    window.addEventListener('resize',resize);
    window.addEventListener('load',()=>setTimeout(()=>{resize();startJourney();},300));
    setTimeout(()=>{resize();startJourney();},400);
</script>
</body>
</html>
