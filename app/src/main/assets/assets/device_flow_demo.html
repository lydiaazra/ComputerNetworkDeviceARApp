<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <style>
        *{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-tap-highlight-color:transparent;}
        html,body{width:100%;height:100%;overflow:hidden;background:transparent;}
        #threeCanvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:1;pointer-events:none;}
        #uiCanvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:2;touch-action:none;}
    </style>
</head>
<body>
<canvas id="threeCanvas"></canvas>
<canvas id="uiCanvas"></canvas>

<script src="three.min.js"></script>
<script src="GLTFLoader.js"></script>
<script>
    // ─── TOPOLOGY — matches the reference: Switch centre, 5 PCs around it ───────
    const NODES = {
    switch: { glb:'switch.glb', label:'Switch', pos:new THREE.Vector3(0, 0, 0), isHub:true },
    pcA: { glb:'pc.glb', label:'PC A', pos:new THREE.Vector3(0, 1.05, 0) },
    pcE: { glb:'pc.glb', label:'PC E', pos:new THREE.Vector3(-1.05, 0.35, 0) },
    pcB: { glb:'pc.glb', label:'PC B', pos:new THREE.Vector3(1.05, 0.35, 0) },
    pcD: { glb:'pc.glb', label:'PC D', pos:new THREE.Vector3(-0.65, -0.95, 0) },
    pcC: { glb:'pc.glb', label:'PC C', pos:new THREE.Vector3(0.65, -0.95, 0) },
    };
    const PC_IDS = ['pcA','pcE','pcB','pcD','pcC'];

    let isDemoMode = false;
    let selectingSource = null; // id of source PC while awaiting a destination tap in Try Mode
    let blockedIds = [];        // PCs not involved in the current frame — shown "Blocked"

    const threeCanvas = document.getElementById('threeCanvas');
    const renderer = new THREE.WebGLRenderer({canvas:threeCanvas,antialias:true,alpha:true});
    renderer.setClearColor(0x000000, 0);
    renderer.setPixelRatio(Math.min(devicePixelRatio,2));
    renderer.setSize(innerWidth, innerHeight);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.01, 100);
    camera.position.set(0, 0, 5.4);
    camera.lookAt(0, 0, 0);

    scene.add(new THREE.AmbientLight(0xffffff, 1.6));
    const key = new THREE.DirectionalLight(0xffffff, 1.0);
    key.position.set(2,4,3); scene.add(key);
    const fill = new THREE.DirectionalLight(0x7EDCFF, 0.4);
    fill.position.set(-3,0,-2); scene.add(fill);

    const pivot = new THREE.Group();
    pivot.position.y = 0.55;
    scene.add(pivot);

    const nodeGroups = {};
    const nodeModels = {};
    const cableCurves = {};   // id -> QuadraticBezierCurve3 (node <-> switch)
    const cableMeshes = {};
    let loadedCount = 0;

    Object.keys(NODES).forEach(id=>{
    const g = new THREE.Group();
    g.position.copy(NODES[id].pos);
    pivot.add(g);
    nodeGroups[id] = g;
    });

    // ─── LOADING — one GLB request at a time via the Android bridge ─────────────
    let loadQueue = Object.keys(NODES).slice();
    function loadNext(){
    if (loadQueue.length === 0) { onAllLoaded(); return; }
    const id = loadQueue.shift();
    currentLoadingId = id;
    if (window.AndroidBridge) AndroidBridge.requestGlb(NODES[id].glb);
    else { buildPlaceholder(id); loadNext(); }
    }
    let currentLoadingId = null;

    window.onGlbReady = function(){
    const total = AndroidBridge.getGlbLength();
    const id = currentLoadingId;
    if (total === 0) { buildPlaceholder(id); loadNext(); return; }
    const chunks = []; let offset = 0;
    function fetchNext(){
    if (offset >= total){
    const b64 = chunks.join('');
    const binary = atob(b64);
    const buf = new ArrayBuffer(binary.length);
    const view = new Uint8Array(buf);
    for (let i=0;i<binary.length;i++) view[i]=binary.charCodeAt(i);
    new THREE.GLTFLoader().parse(buf,'',function(gltf){
    setNodeModel(id, gltf.scene); loadNext();
    }, function(){ buildPlaceholder(id); loadNext(); });
    return;
    }
    const chunk = AndroidBridge.getGlbChunk(offset);
    if (!chunk || chunk.length===0){ buildPlaceholder(id); loadNext(); return; }
    chunks.push(chunk); offset += chunk.length;
    setTimeout(fetchNext,0);
    }
    fetchNext();
    };

    function setNodeModel(id, model){
    const box = new THREE.Box3().setFromObject(model);
    const size = box.getSize(new THREE.Vector3());
    const ctr = box.getCenter(new THREE.Vector3());
    const target = NODES[id].isHub ? 1.05 : 0.28;
    const sc = target / Math.max(size.x, size.y, size.z);
    model.scale.setScalar(sc);
    model.position.sub(ctr.multiplyScalar(sc));
    nodeGroups[id].add(model);
    nodeModels[id] = model;
    }

    function buildPlaceholder(id){
    const isHub = NODES[id].isHub;
    const geo = isHub ? new THREE.BoxGeometry(1.1,0.42,0.6) : new THREE.BoxGeometry(0.24,0.15,0.17);
    const mat = new THREE.MeshStandardMaterial({color: isHub?0x2A6B20:0x4A6AE0});
    const mesh = new THREE.Mesh(geo, mat);
    nodeGroups[id].add(mesh);
    nodeModels[id] = mesh;
    }

    // ─── CABLES — drawn once, all nodes already connected (this is a behaviour
    // demo, not an assembly exercise) ─────────────────────────────────────────
    function buildCables(){
    PC_IDS.forEach(id=>{
    const a = NODES[id].pos, b = NODES.switch.pos;
    const mid = a.clone().add(b).multiplyScalar(0.5);
    mid.y -= 0.05;
    const curve = new THREE.QuadraticBezierCurve3(a, mid, b);
    cableCurves[id] = curve;
    const geo = new THREE.TubeGeometry(curve, 16, 0.010, 8, false);
    const mat = new THREE.MeshStandardMaterial({color:0x3A4656, roughness:0.6});
    const tube = new THREE.Mesh(geo, mat);
    pivot.add(tube);
    cableMeshes[id] = tube;
    });
    }

    function setCableActive(id, active, blocked){
    const mesh = cableMeshes[id];
    if (!mesh) return;
    mesh.material.color.set(blocked ? 0x8A2A2A : (active ? 0x3EC26E : 0x3A4656));
    }
    function resetCables(){
    PC_IDS.forEach(id=>setCableActive(id, false, false));
    }

    function onAllLoaded(){
    buildCables();
    if (window.AndroidBridge) AndroidBridge.onSceneReady();
    setStatus('🔀','Tap a PC to send data','Choose a source device, then a destination.');
    speak('This is a Switch. Tap a PC to send data — pick a source, then a destination.');
    }

    function speak(text){
    if (window.AndroidBridge) AndroidBridge.speakAvatarLine(text);
    }
    function setStatus(icon, title, sub){
    if (window.AndroidBridge) AndroidBridge.setStatus(icon, title, sub);
    }

    // ─── PACKET ANIMATION ─────────────────────────────────────────────────────────
    let packetMesh = null;
    function ensurePacket(){
    if (packetMesh) return packetMesh;
    const geo = new THREE.SphereGeometry(0.045, 12, 12);
    const mat = new THREE.MeshBasicMaterial({color:0xFFD84A});
    packetMesh = new THREE.Mesh(geo, mat);
    packetMesh.visible = false;
    pivot.add(packetMesh);
    return packetMesh;
    }

    function animateAlongCurve(curve, reverse, duration, onDone){
    const mesh = ensurePacket();
    mesh.visible = true;
    const start = performance.now();
    function step(now){
    let t = (now - start) / duration;
    if (t > 1) t = 1;
    const tt = reverse ? (1 - t) : t;
    const p = curve.getPoint(tt);
    mesh.position.copy(p);
    if (t < 1) requestAnimationFrame(step);
    else { mesh.visible = false; onDone && onDone(); }
    }
    requestAnimationFrame(step);
    }

    // ─── SEND A FRAME — source PC to destination PC, via the Switch ─────────────
    function sendFrame(sourceId, destId, spoken){
    blockedIds = PC_IDS.filter(id => id !== sourceId && id !== destId);
    resetCables();
    setCableActive(sourceId, true, false);
    blockedIds.forEach(id => setCableActive(id, false, true));

    setStatus('📤', NODES[sourceId].label+' → Switch', 'Sending frame to the Switch...');
    animateAlongCurve(cableCurves[sourceId], false, 900, ()=>{
    setCableActive(destId, true, false);
    setStatus('🔀', 'Switch forwards it', NODES[sourceId].label+' → Switch → '+NODES[destId].label+' only.');
    if (spoken) speak(spoken);
    animateAlongCurve(cableCurves[destId], true, 900, ()=>{
    const blockedNames = blockedIds.map(id=>NODES[id].label).join(', ');
    setStatus('✅', 'Delivered!', NODES[sourceId].label+' → Switch → '+NODES[destId].label+' only. '+blockedNames+' blocked.');
    if (isDemoMode) setTimeout(onDemoStepDone, 1400);
    });
    });
    }

    // ─── DEMO MODE — autoplay, matches the reference exactly ────────────────────
    window.onDemoModeToggle = function(){
    if (isDemoMode) return;
    isDemoMode = true;
    selectingSource = null;
    resetCables();
    speak('Watch what happens when PC A sends data to PC E.');
    setStatus('🎬','Demo','PC A wants to send data to PC E.');
    setTimeout(()=>{
    sendFrame('pcA','pcE','The Switch knows exactly where PC E is, so it delivers the frame directly — not to everyone.');
    }, 1600);
    };

    function onDemoStepDone(){
    speak('Unlike a Hub, which would broadcast to every device, the Switch only sends to the device that needs it — reducing unnecessary traffic on the network.');
    setTimeout(()=>{
    isDemoMode = false;
    resetCables();
    setStatus('🔀','Now you try','Tap a PC to send data — pick a source, then a destination.');
    speak('Now it\'s your turn. Tap a source PC, then a destination.');
    }, 3200);
    }

    // ─── TRY MODE — tap source, then destination ─────────────────────────────────
    const raycaster = new THREE.Raycaster();
    function raycastHit(xPix, yPix){
    const mouse = new THREE.Vector2((xPix/uiCanvas.width)*2-1, -(yPix/uiCanvas.height)*2+1);
    raycaster.setFromCamera(mouse, camera);
    const meshes = Object.values(nodeModels);
    const hits = raycaster.intersectObjects(meshes, true);
    return hits.length ? hits[0] : null;
    }
    function nodeIdForObject(obj){
    let o = obj;
    while (o){
    for (const id in nodeModels){ if (nodeModels[id] === o) return id; }
    o = o.parent;
    }
    return null;
    }

    const uiCanvas = document.getElementById('uiCanvas');
    uiCanvas.width = innerWidth; uiCanvas.height = innerHeight;

    function cp(e){
    const r = uiCanvas.getBoundingClientRect();
    const s = e.changedTouches ? e.changedTouches[0] : e;
    return { x:(s.clientX-r.left)*(uiCanvas.width/r.width), y:(s.clientY-r.top)*(uiCanvas.height/r.height) };
    }

    uiCanvas.addEventListener('touchend', e=>{
    e.preventDefault();
    if (isDemoMode) return;
    const {x,y} = cp(e);
    const hit = raycastHit(x,y);
    if (!hit) return;
    const id = nodeIdForObject(hit.object);
    if (!id || id === 'switch') return;

    if (!selectingSource){
    selectingSource = id;
    resetCables();
    setCableActive(id, true, false);
    setStatus('👆', NODES[id].label+' selected', 'Now tap the destination PC.');
    speak(NODES[id].label+' selected. Now tap the destination.');
    return;
    }
    if (id === selectingSource){ return; }

    const src = selectingSource;
    selectingSource = null;
    sendFrame(src, id, null);
    }, {passive:false});

    // ─── RENDER LOOP ──────────────────────────────────────────────────────────────
    function animate(){
    requestAnimationFrame(animate);
    renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', ()=>{
    camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
    uiCanvas.width = innerWidth; uiCanvas.height = innerHeight;
    });

    window.addEventListener('load', function(){
    var t = 0;
    (function wait(){
    if (typeof THREE !== 'undefined' && THREE.GLTFLoader){
    loadNext();
    } else if (t++ < 30){ setTimeout(wait,200); }
    })();
    });
</script>
</body>
</html>
