<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <style>
        *{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-tap-highlight-color:transparent;}
        html,body{width:100%;height:100%;overflow:hidden;background:transparent;}
        #threeCanvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:1;pointer-events:none;}
        #uiCanvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:2;touch-action:none;}
        #deviceBar{
        position:fixed;left:0;right:0;top:90px;z-index:3;
        background:rgba(13,17,23,0.92);border-bottom:1px solid #21262D;
        display:none;justify-content:space-between;align-items:center;
        padding:8px 8px;gap:5px;
        }
        .devBtn{
        flex:1 0 auto;min-width:50px;
        background:#1A1F2B;border:1px solid #30363D;color:#586071;
        font:bold 9px system-ui;padding:8px 2px;border-radius:8px;
        text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
        }
        .devBtn.active{background:#1F6FEB33;border-color:#1F6FEB;color:#7EDCFF;}
        .devBtn.done{background:#3EC26E22;border-color:#3EC26E;color:#3EC26E;}
    </style>
</head>
<body>
<canvas id="threeCanvas"></canvas>
<canvas id="uiCanvas"></canvas>
<div id="deviceBar"></div>

<script src="three.min.js"></script>
<script src="GLTFLoader.js"></script>
<script>
    // ─── PER-DEVICE CONFIG ────────────────────────────────────────────────────────
    // secondary[].connectsTo: '__center__' (default) or another secondary's id,
    // enabling multi-level topologies (e.g. Firewall -> Switch -> PC).
    const DEVICE_CONFIGS = {

    router: {
    center:{glb:'router.glb', label:'Router'},
    centerPlacedLine:'Router placed. Every Router has a routing table that tells it exactly which direction to send data, based on its destination IP address.',
    secondary:[
    {id:'modem', glb:'modem.glb', label:'Modem', promptLine:'Now tap Modem to add it — this is what actually connects your Router to your Internet Service Provider.', connectLine:'This is the Modem. It translates the signal from your ISP into a format your Router can understand — think of it as the doorway to the Internet.', pos:[0,1.0,0]},
    {id:'switch', glb:'switch.glb', label:'Switch', promptLine:'Now tap Switch to add it — this expands your wired network to support more devices.', connectLine:'This is a Switch. Notice it plugs directly into the Router, just like every other device here — the Router doesn\'t care what\'s connected, only where to send data.', pos:[-1.0,0.3,0]},
    {id:'wap', glb:'wap.glb', label:'WAP', promptLine:'Now tap WAP to add it — this is how wireless devices join your network.', connectLine:'This is a Wireless Access Point. It lets phones, laptops and tablets connect to your Router without a cable.', pos:[1.0,0.3,0]},
    {id:'pc', glb:'pc.glb', label:'PC', promptLine:'One more — now tap PC to finish, a device connected directly to the Router.', connectLine:'This is a PC, connected straight to the Router — no Switch needed for just one device.', pos:[0,-0.9,0]},
    ],
    introLine:'Hi, this is a Try Mode for Router. A Router operates at Layer 3 of the OSI model — unlike a Switch, which only knows about devices on its own local network, a Router can connect entirely different networks together, most importantly connecting your home to the Internet. Let\'s build that network together. Tap Router to place it.',
    readyLine:'Connection successful! A Router\'s real job is deciding where data goes next. Tap a source device, then a destination, to see how the Router routes traffic between them.',
    selectSourceLine:'selected as the source. Now tap another device — try the Modem to see data leave for the Internet, or any other device to see it stay on your local network.',
    deliverLine:'The Router looks at the destination\'s IP address and decides exactly which direction to send this data — whether that\'s out to the Internet through the Modem, or to another device on your LAN.',
    deliveredLine:'Delivered! {src} → Router → {dest}. This is exactly how your Router decides where every piece of data on your network should go.',
    simMode:'selective',
    },

    switch: {
    center:{glb:'switch.glb', label:'Switch'},
    centerPlacedLine:'Switch placed. A Switch operates at Layer 2 of the OSI model, using MAC addresses to identify each connected device.',
    secondary:[
    {id:'pcA', glb:'pc.glb', label:'PC A', promptLine:'Now tap PC A to add it — our first device on this network, and the one we\'ll use to send data from later.', connectLine:'This is PC A, a wired device connected directly to the Switch through an Ethernet cable.', pos:[0,1.0,0]},
    {id:'pcB', glb:'pc.glb', label:'PC B', promptLine:'Great, now tap PC B to add another device to the network.', connectLine:'This is PC B, another wired device on the same network. Each device connected to the Switch gets its own dedicated port.', pos:[-1.0,0.3,0]},
    {id:'pcC', glb:'pc.glb', label:'PC C', promptLine:'Now tap PC C — we\'ll use this one as our delivery destination shortly.', connectLine:'This is PC C. As more devices connect, the Switch keeps track of exactly which port each one is on.', pos:[1.0,0.3,0]},
    {id:'lapD', glb:'laptop.glb', label:'Laptop D', promptLine:'One more to go — now tap Laptop D to finish building the network.', connectLine:'This is Laptop D, connected over a wired cable just like the others — a Switch doesn\'t care what type of device it is, only where it\'s connected.', pos:[0,-0.9,0]},
    ],
    introLine:'Hi, this is a Try Mode for Switch. A Switch is one of the most common devices in a Local Area Network — it connects multiple computers together and decides exactly where each piece of data should go. Let\'s build a network together. Tap Switch to place it.',
    readyLine:'Connection successful! Now that every device is connected, let\'s see the Switch in action. Tap any PC as your source, then tap another PC as the destination, to send data from one to the other.',
    selectSourceLine:'selected as the source. Now tap any other PC to choose it as the destination you want to send data to.',
    deliverLine:'The Switch checks its address table and knows exactly which port {dest} is on, so it delivers this frame directly — not to every device.',
    deliveredLine:'Delivered! {src} → Switch → {dest} only. Unlike a Hub, which floods data to everyone, a Switch keeps traffic efficient by sending it only where it needs to go.',
    simMode:'selective',
    },

    hub: {
    center:{glb:'hub.glb', label:'Hub'},
    centerPlacedLine:'Hub placed. A Hub has no intelligence — it can\'t read addresses or make decisions, it just electrically repeats whatever comes in.',
    secondary:[
    {id:'pcA', glb:'pc.glb', label:'PC A', promptLine:'Now tap PC A to add it — the first device on this Hub.', connectLine:'This is PC A. Like every device on a Hub, it will receive a copy of every signal sent — even ones not meant for it.', pos:[0,1.0,0]},
    {id:'lapB', glb:'laptop.glb', label:'Laptop B', promptLine:'Now tap Laptop B to add another device.', connectLine:'This is Laptop B. The Hub treats it exactly the same as any other device — no priority, no filtering.', pos:[-1.0,0.3,0]},
    {id:'pcC', glb:'pc.glb', label:'PC C', promptLine:'Now tap PC C to keep building the network.', connectLine:'This is PC C. Notice the Hub doesn\'t check what type of device connects — PC, laptop, it\'s all the same to a Hub.', pos:[1.0,0.3,0]},
    {id:'lapD', glb:'laptop.glb', label:'Laptop D', promptLine:'One more — now tap Laptop D to finish.', connectLine:'This is Laptop D, our last device. Every device here is about to see how a Hub really works.', pos:[0,-0.9,0]},
    ],
    introLine:'Hi, this is a Try Mode for Hub. Unlike a Switch, a Hub is a simple Layer 1 device — it doesn\'t know which device is which, it just repeats every signal to every port. Let\'s build a network together. Tap Hub to place it.',
    readyLine:'Connection successful! Now tap any device to send data — watch what happens when a Hub gets involved.',
    broadcastLine:'The Hub doesn\'t check where data should go — it broadcasts to every device connected to it, whether they need it or not.',
    deliveredAllLine:'Delivered to everyone! This is why Hubs create more network traffic than Switches — every device gets every message, needed or not.',
    simMode:'broadcast',
    },

    // ─── FIREWALL — hierarchical topology: Router (WAN side) and Switch (LAN
    // side, with two PCs beneath it) both connect to the Firewall, plus a
    // Blocked Site for the filtering demo. connectsTo builds the tree.
    firewall: {
    center:{glb:'firewall.glb', label:'Firewall'},
    centerPlacedLine:'Firewall placed. A Firewall sits between your protected network and the outside world, inspecting traffic that tries to pass through.',
    secondary:[
    {id:'router', glb:'router.glb', label:'Router', connectsTo:'__center__', promptLine:'Now tap Router to add it — this represents the connection out to the Internet (WAN).', connectLine:'This is the Router, connecting the Firewall to the wider Internet.', pos:[0,0.85,0]},
    {id:'switch', glb:'switch.glb', label:'Switch', connectsTo:'__center__', promptLine:'Now tap Switch to add it — this will expand into your protected internal network.', connectLine:'This is a Switch, connecting multiple internal devices behind the Firewall.', pos:[-0.85,-0.05,0]},
    {id:'pcA', glb:'pc.glb', label:'PC A', connectsTo:'switch', promptLine:'Now tap PC A — it connects through the Switch, not directly to the Firewall.', connectLine:'This is PC A, protected behind the Firewall through the Switch.', pos:[-1.15,-0.85,0]},
    {id:'pcB', glb:'pc.glb', label:'PC B', connectsTo:'switch', promptLine:'Now tap PC B to add another protected device.', connectLine:'This is PC B, also reaching the Internet only through the Switch and Firewall.', pos:[-0.35,-0.9,0]},
    {id:'blockedSite', glb:'server.glb', label:'Blocked Site', connectsTo:'__center__', promptLine:'Last one — now tap Blocked Site to finish. This one will test the Firewall\'s rules.', connectLine:'This is a website on the Internet that the Firewall has been told to block.', pos:[0.85,-0.2,0]},
    ],
    blockedIds:['blockedSite'],
    introLine:'Hi, this is a Try Mode for Firewall. A Firewall isn\'t just one flat connection — it usually sits between a Router (leading to the Internet) and a Switch (leading to your protected devices). Let\'s build that network together. Tap Firewall to place it.',
    readyLine:'Connection successful! Notice PC A and PC B connect through the Switch, not directly to the Firewall — that\'s how real networks are structured. Tap a source device, then a destination, to see how the Firewall handles it.',
    selectSourceLine:'selected as the source. Now tap a destination — try the Router to send data out to the Internet, or the Blocked Site to see the Firewall reject it.',
    blockedLine:'The Firewall inspected this request and rejected it — the Blocked Site does not match its allowed rules.',
    deliverLine:'The Firewall checks its rules, sees this traffic is allowed, and passes it through — even though it has to cross both the Switch and the Firewall to get there.',
    deliveredLine:'Delivered! The data travelled through every device in its path, and the Firewall allowed it through because it matched the rules.',
    simMode:'hierarchy',
    },

    repeater: {
    center:{glb:'repeater.glb', label:'Repeater'},
    secondary:[
    {id:'src', glb:'pc.glb', label:'Source', connectLine:'This is the Source device sending a weak signal.', pos:[-1.0,0,0]},
    {id:'dest', glb:'pc.glb', label:'Destination', connectLine:'This is the Destination device, far from the source.', pos:[1.0,0,0]},
    ],
    introLine:'Hi, this is a Try Mode for Repeater. Let\'s build a network together. Tap Repeater to place it.',
    simMode:'single', fixedSrc:'src', fixedDest:'dest',
    },

    gateway: {
    center:{glb:'gateway.glb', label:'Gateway'},
    secondary:[
    {id:'lan', glb:'pc.glb', label:'LAN Network', connectLine:'This represents your Local Area Network.', pos:[-1.0,0,0]},
    {id:'wan', glb:'server.glb', label:'Internet / WAN', connectLine:'This represents the Internet, a different type of network.', pos:[1.0,0,0]},
    ],
    introLine:'Hi, this is a Try Mode for Gateway. Let\'s build a network together. Tap Gateway to place it.',
    simMode:'single', fixedSrc:'lan', fixedDest:'wan',
    },

    wap: {
    center:{glb:'wap.glb', label:'WAP'},
    secondary:[
    {id:'wireless', glb:'laptop.glb', label:'Wireless Laptop', connectLine:'This laptop connects wirelessly over WiFi.', pos:[-1.0,0,0]},
    {id:'wired', glb:'pc.glb', label:'Wired Network', connectLine:'This represents the wired network the WAP bridges to.', pos:[1.0,0,0]},
    ],
    introLine:'Hi, this is a Try Mode for WAP. Let\'s build a network together. Tap WAP to place it.',
    simMode:'single', fixedSrc:'wireless', fixedDest:'wired',
    },

    server: {
    center:{glb:'server.glb', label:'Server'},
    secondary:[
    {id:'client', glb:'pc.glb', label:'Client PC', connectLine:'This is a Client PC that will send a request.', pos:[0,-1.0,0]},
    ],
    introLine:'Hi, this is a Try Mode for Server. Let\'s build a network together. Tap Server to place it.',
    simMode:'single', roundtrip:true, fixedSrc:'client',
    },

    };

    let CONFIG = null, CENTER = null, SECONDARY = null;

    const threeCanvas = document.getElementById('threeCanvas');
    const renderer = new THREE.WebGLRenderer({canvas:threeCanvas,antialias:true,alpha:true});
    renderer.setClearColor(0x000000, 0);
    renderer.setPixelRatio(Math.min(devicePixelRatio,2));
    renderer.setSize(innerWidth, innerHeight);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.01, 100);
    camera.position.set(0, 0, 5.4);
    camera.lookAt(0, 0, 0);

    scene.add(new THREE.AmbientLight(0xffffff, 1.6));
    const key = new THREE.DirectionalLight(0xffffff, 1.0);
    key.position.set(2,4,3); scene.add(key);
    const fill = new THREE.DirectionalLight(0x7EDCFF, 0.4);
    fill.position.set(-3,0,-2); scene.add(fill);

    const pivot = new THREE.Group();
    pivot.position.y = 0.4;
    scene.add(pivot);

    function speak(text){ if (window.AndroidBridge) AndroidBridge.speakAvatarLine(text); }
    function setStatus(icon, title, sub){ if (window.AndroidBridge) AndroidBridge.setStatus(icon, title, sub); }

    // Rough estimate: ~350ms per word, minimum 1200ms — longer sentences get
    // more time on screen before the flow auto-advances to the next step.
    function speakDelay(text){
    const words = text.split(' ').length;
    return Math.max(1800, words * 480);
    }

    // ─── STATE ────────────────────────────────────────────────────────────────────
    let step = 0;
    let advanceCallCount = 0;
    const groups = {}, models = {}, cableCurves = {}, cableMeshes = {};
    let deviceLoading = null;
    let pinchStartDist = null, pinchStartScale = 1, pinchStartAngle = null, pinchStartRotY = 0;
    let simSource = null;

    function currentId(){ return step === 0 ? '__center__' : SECONDARY[step-1].id; }

    // Which node does this secondary device connect to? Defaults to the centre.
    function connectTargetOf(id){
    const entry = SECONDARY.find(s=>s.id===id);
    return (entry && entry.connectsTo) || '__center__';
    }

    // ─── ENTRY POINT — Android calls this once, right after page load ───────────
    window.initDeviceType = function(deviceType){
    var attempts = 0;
    (function tryInit(){
    if (typeof THREE !== 'undefined' && THREE.GLTFLoader){
    CONFIG = DEVICE_CONFIGS[deviceType] || DEVICE_CONFIGS.switch;
    CENTER = CONFIG.center; SECONDARY = CONFIG.secondary;
    init();
    } else if (attempts++ < 30){ setTimeout(tryInit, 200); }
    })();
    };

    function init(){
    const centerGroup = new THREE.Group();
    pivot.add(centerGroup);
    groups['__center__'] = centerGroup;
    SECONDARY.forEach(s=>{
    const g = new THREE.Group();
    pivot.add(g);
    groups[s.id] = g;
    });

    setStatus('🔌', CENTER.label, CONFIG.introLine);
    speak(CONFIG.introLine);
    buildDeviceBar();
    }

    function buildDeviceBar(){
    const bar = document.getElementById('deviceBar');
    bar.style.display = 'flex';
    bar.innerHTML = '';

    const centerBtn = document.createElement('button');
    centerBtn.className = 'devBtn';
    centerBtn.id = 'dbtn-__center__';
    centerBtn.textContent = CENTER.label;
    centerBtn.addEventListener('touchend', (e)=>{ e.preventDefault(); e.stopPropagation(); onDeviceBarTap('__center__'); }, {passive:false});
    bar.appendChild(centerBtn);

    SECONDARY.forEach(s=>{
    const btn = document.createElement('button');
    btn.className = 'devBtn';
    btn.id = 'dbtn-'+s.id;
    btn.textContent = s.label;
    btn.addEventListener('touchend', (e)=>{ e.preventDefault(); e.stopPropagation(); onDeviceBarTap(s.id); }, {passive:false});
    bar.appendChild(btn);
    });
    updateDeviceBar();
    }

    function updateDeviceBar(){
    const curId = currentId();
    const allIds = ['__center__'].concat(SECONDARY.map(s=>s.id));
    allIds.forEach((id,i)=>{
    const btn = document.getElementById('dbtn-'+id);
    if (!btn) return;
    btn.classList.remove('active','done');
    if (i < step) btn.classList.add('done');
    else if (id === curId) btn.classList.add('active');
    });
    }

    function onDeviceBarTap(id){
    if (id !== currentId()) return;
    if (models[id]) return;
    requestModel(id);
    }

    function requestModel(id){
    deviceLoading = id;
    const glb = id === '__center__' ? CENTER.glb : SECONDARY.find(s=>s.id===id).glb;
    const pos = id === '__center__' ? [0,0,0] : SECONDARY.find(s=>s.id===id).pos;
    groups[id].position.set(pos[0], pos[1], pos[2]);
    if (window.AndroidBridge) AndroidBridge.requestGlb(glb);
    else { buildPlaceholder(id, glb); onModelLoaded(id); }
    }

    window.onGlbReady = function(){
    const id = deviceLoading;
    deviceLoading = null;
    if (!id) return;
    const glb = id === '__center__' ? CENTER.glb : SECONDARY.find(s=>s.id===id).glb;
    const total = AndroidBridge.getGlbLength();
    if (total === 0) { buildPlaceholder(id, glb); onModelLoaded(id); return; }
    const chunks = []; let offset = 0;
    function fetchNext(){
    if (offset >= total){
    const b64 = chunks.join('');
    const binary = atob(b64);
    const buf = new ArrayBuffer(binary.length);
    const view = new Uint8Array(buf);
    for (let i=0;i<binary.length;i++) view[i]=binary.charCodeAt(i);
    new THREE.GLTFLoader().parse(buf,'',function(gltf){
    setModel(id, gltf.scene); onModelLoaded(id);
    }, function(){ buildPlaceholder(id, glb); onModelLoaded(id); });
    return;
    }
    const chunk = AndroidBridge.getGlbChunk(offset);
    if (!chunk || chunk.length===0){ buildPlaceholder(id, glb); onModelLoaded(id); return; }
    chunks.push(chunk); offset += chunk.length;
    setTimeout(fetchNext,0);
    }
    fetchNext();
    };

    function setModel(id, model){
    const box = new THREE.Box3().setFromObject(model);
    const size = box.getSize(new THREE.Vector3());
    const ctr = box.getCenter(new THREE.Vector3());
    const target = id === '__center__' ? 1.0 : 0.4;
    const sc = target / Math.max(size.x, size.y, size.z);
    model.scale.setScalar(sc);
    model.position.sub(ctr.multiplyScalar(sc));
    groups[id].add(model);
    models[id] = addHitArea(id, target);
    }

    function buildPlaceholder(id, glb){
    const isCenter = id === '__center__';
    const geo = isCenter ? new THREE.BoxGeometry(1.1,0.42,0.6) : new THREE.BoxGeometry(0.35,0.22,0.25);
    const mat = new THREE.MeshStandardMaterial({color: isCenter?0x2A6B20:0x4A6AE0});
    const mesh = new THREE.Mesh(geo, mat);
    groups[id].add(mesh);
    models[id] = addHitArea(id, isCenter ? 1.0 : 0.4);
    }

    // A generous, invisible sphere used only for raycasting — much easier to
    // tap/drag reliably than the exact (often thin or oddly-shaped) model mesh.
    function addHitArea(id, approxSize){
    const geo = new THREE.SphereGeometry(approxSize * 0.75, 8, 8);
    const mat = new THREE.MeshBasicMaterial({transparent:true, opacity:0, depthWrite:false});
    const hitMesh = new THREE.Mesh(geo, mat);
    groups[id].add(hitMesh);
    return hitMesh;
    }

    function onModelLoaded(id){
    if (id === '__center__'){
    speak(CONFIG.centerPlacedLine || (CENTER.label+' placed.'));
    advanceStep();
    } else {
    const s = SECONDARY.find(x=>x.id===id);
    addCable(id, connectTargetOf(id));
    const targetLabel = connectTargetOf(id)==='__center__' ? CENTER.label : labelOf(connectTargetOf(id));
    const fullLine = s.connectLine+' '+s.label+' is now connected to the '+targetLabel+'.';
    setStatus('✅', s.label+' connected!', fullLine);
    speak(fullLine);
    advanceStep();
    }
    }


   function advanceStep(){
    advanceCallCount++;
    alert('advanceStep call #' + advanceCallCount + ' | step before=' + step);
    step++;
    updateDeviceBar();
    if (step > SECONDARY.length){
    alert('DEBUG: reached finishBuilding. step='+step+' SECONDARY.length='+SECONDARY.length+' CONFIG.readyLine='+(CONFIG.readyLine ? 'SET' : 'undefined'));
    finishBuilding();
    return;
    }
    const nextId = currentId();
    const nextEntry = nextId === '__center__' ? null : SECONDARY.find(s=>s.id===nextId);
    const label = nextId === '__center__' ? CENTER.label : nextEntry.label;
    const line = (nextEntry && nextEntry.promptLine) || ('Now tap '+label+' to add it.');
    setStatus('👆','Next: '+label, line);
    speak(line);
    }

    function finishBuilding(){
    document.getElementById('deviceBar').style.display = 'none';
    const line = CONFIG.readyLine || ('Connection successful! Now tap a source device, then a destination, to see how data flows through the '+CENTER.label+'.');
    setStatus('✅','Connection successful!', line);
    speak(line);
    }

    // ─── CABLES ───────────────────────────────────────────────────────────────────
    function addCable(fromId, toId){
    const a = groups[fromId].position.clone();
    const b = groups[toId].position.clone();
    const mid = a.clone().add(b).multiplyScalar(0.5); mid.y -= 0.05;
    const curve = new THREE.QuadraticBezierCurve3(a, mid, b);
    cableCurves[fromId] = curve;
    const geo = new THREE.TubeGeometry(curve, 16, 0.02, 8, false);
    const mat = new THREE.MeshStandardMaterial({color:0x3EC26E, emissive:0x3EC26E, emissiveIntensity:0.9, roughness:0.4});
    const tube = new THREE.Mesh(geo, mat);
    pivot.add(tube);
    cableMeshes[fromId] = tube;
    let t0 = performance.now();
    function pulse(now){
    const t = (now - t0) / 700;
    if (t < 1){
    mat.emissiveIntensity = 0.9 + Math.sin(t*Math.PI)*1.2;
    requestAnimationFrame(pulse);
    } else {
    mat.emissiveIntensity = 0.5;
    }
    }
    requestAnimationFrame(pulse);
    }

    function setCableColor(id, hexColor, glow){
    const tube = cableMeshes[id];
    if (!tube) return;
    tube.material.color.set(hexColor);
    tube.material.emissive.set(hexColor);
    tube.material.emissiveIntensity = glow ? 0.9 : 0.4;
    }

    function resetAllCables(){
    for (const id in cableMeshes) setCableColor(id, 0x3EC26E, false);
    }

    // ─── PACKET ANIMATION ─────────────────────────────────────────────────────────
    let packetMesh = null;
    function ensurePacket(){
    if (packetMesh) return packetMesh;
    const geo = new THREE.SphereGeometry(0.045, 12, 12);
    const mat = new THREE.MeshBasicMaterial({color:0xFFD84A});
    packetMesh = new THREE.Mesh(geo, mat);
    packetMesh.visible = false;
    pivot.add(packetMesh);
    return packetMesh;
    }
    function animateAlongCurve(curve, reverse, duration, onDone){
    const mesh = ensurePacket();
    mesh.visible = true;
    const start = performance.now();
    function frame(now){
    let t = (now - start) / duration;
    if (t > 1) t = 1;
    const tt = reverse ? (1 - t) : t;
    mesh.position.copy(curve.getPoint(tt));
    if (t < 1) requestAnimationFrame(frame);
    else { mesh.visible = false; onDone && onDone(); }
    }
    requestAnimationFrame(frame);
    }

    function labelOf(id){
    if (id === '__center__') return CENTER.label;
    const e = SECONDARY.find(s=>s.id===id);
    return e ? e.label : id;
    }

    // ─── PATH-FINDING for hierarchy mode ─────────────────────────────────────────
    // Walks from a leaf up through connectsTo until it reaches the centre.
    function getPathToCenter(id){
    const path = [id];
    let current = id;
    while (current !== '__center__'){
    const next = connectTargetOf(current);
    path.push(next);
    current = next;
    }
    return path;
    }

    // Full hop-by-hop path between any two nodes, always routed via the centre
    // (correct for the tree depths used here; not a general shortest-path solver).
    function getFullPath(srcId, destId){
    const srcPath = getPathToCenter(srcId);
    const destPath = getPathToCenter(destId);
    const destPathReversed = destPath.slice(0, -1).reverse();
    return srcPath.concat(destPathReversed);
    }

    // Animates a packet along a multi-hop path, one segment at a time.
    function animatePath(path, onDone){
    let i = 0;
    function step(){
    if (i >= path.length - 1){ onDone && onDone(); return; }
    const a = path[i], b = path[i+1];
    if (connectTargetOf(a) === b){
    // a is a child of b — travelling up, cable a stores curve a->b already
    animateAlongCurve(cableCurves[a], false, 700, ()=>{ i++; step(); });
    } else {
    // b is a child of a — travelling down, cable b stores curve b->a, so reverse it
    animateAlongCurve(cableCurves[b], true, 700, ()=>{ i++; step(); });
    }
    }
    step();
    }

    function fillTemplate(str, srcId, destId){
    return str.replace('{src}', labelOf(srcId)).replace('{dest}', labelOf(destId));
    }

    // ─── SIMULATE — behaviour depends on CONFIG.simMode ──────────────────────────
    function sendSelective(srcId, destId){
    const blocked = (CONFIG.blockedIds||[]).includes(destId);
    const others = SECONDARY.map(s=>s.id).filter(id=>id!==srcId && id!==destId);
    resetAllCables();
    setCableColor(srcId, 0x3EC26E, true);
    others.forEach(id=>setCableColor(id, 0xE04444, false));
    setStatus('📤', labelOf(srcId)+' → '+CENTER.label, 'Sending data...');
    animateAlongCurve(cableCurves[srcId], false, 900, ()=>{
    if (blocked){
    setCableColor(destId, 0xE04444, false);
    setStatus('🚫','Blocked!', labelOf(destId)+' is blocked by the '+CENTER.label+'\'s rules.');
    speak('This destination is blocked by the '+CENTER.label+'\'s rules — the connection is rejected.');
    return;
    }
    setCableColor(destId, 0x3EC26E, true);
    const deliverLine = CONFIG.deliverLine
    ? fillTemplate(CONFIG.deliverLine, srcId, destId)
    : 'The '+CENTER.label+' delivers this directly to '+labelOf(destId)+', not to every device.';
    const deliveredLine = CONFIG.deliveredLine
    ? fillTemplate(CONFIG.deliveredLine, srcId, destId)
    : labelOf(srcId)+' → '+CENTER.label+' → '+labelOf(destId)+'.';
    setStatus('🔀', CENTER.label+' forwards it', labelOf(srcId)+' → '+CENTER.label+' → '+labelOf(destId)+' only.');
    speak(deliverLine);
    animateAlongCurve(cableCurves[destId], true, 900, ()=>{
    setStatus('✅','Delivered!', deliveredLine);
    });
    });
    }

    function sendBroadcast(srcId){
    const others = SECONDARY.map(s=>s.id).filter(id=>id!==srcId);
    resetAllCables();
    setCableColor(srcId, 0x3EC26E, true);
    setStatus('📤', labelOf(srcId)+' → '+CENTER.label, 'Sending data...');
    animateAlongCurve(cableCurves[srcId], false, 900, ()=>{
    others.forEach(id=>setCableColor(id, 0x3EC26E, true));
    setStatus('🔀', CENTER.label+' broadcasts it', 'Sending to every connected device...');
    speak(CONFIG.broadcastLine || ('The '+CENTER.label+' broadcasts this to every connected device, not just one.'));
    let done = 0;
    others.forEach(id=>{
    animateAlongCurve(cableCurves[id], true, 900, ()=>{
    done++;
    if (done === others.length){
    setStatus('✅','Delivered to everyone!', CONFIG.deliveredAllLine || (labelOf(srcId)+' → '+CENTER.label+' → all '+others.length+' devices.'));
    }
    });
    });
    });
    }

    function sendSingle(){
    const src = CONFIG.fixedSrc, dest = CONFIG.fixedDest;
    resetAllCables();
    setCableColor(src, 0x3EC26E, true);
    setStatus('📤', labelOf(src)+' → '+CENTER.label, 'Sending data...');
    animateAlongCurve(cableCurves[src], false, 900, ()=>{
    if (CONFIG.roundtrip){
    setStatus('⏳', CENTER.label+' processing...', 'The '+CENTER.label+' is preparing a response...');
    speak('The '+CENTER.label+' processes the request...');
    setTimeout(()=>{
    animateAlongCurve(cableCurves[src], false, 900, ()=>{
    setStatus('✅','Response delivered!', CENTER.label+' → '+labelOf(src));
    speak('The response is sent back — this request-response cycle happens every time you load a webpage.');
    });
    }, 900);
    return;
    }
    setCableColor(dest, 0x3EC26E, true);
    setStatus('🔀', CENTER.label, 'Processing...');
    speak('The '+CENTER.label+' processes this and passes it through.');
    animateAlongCurve(cableCurves[dest], true, 900, ()=>{
    setStatus('✅','Delivered!', labelOf(src)+' → '+CENTER.label+' → '+labelOf(dest)+'.');
    });
    });
    }

    // Multi-hop version for tree topologies like Firewall -> Switch -> PC.
    function sendHierarchy(srcId, destId){
    const blocked = (CONFIG.blockedIds||[]).includes(destId);
    resetAllCables();
    if (blocked){
    const upPath = getPathToCenter(srcId);
    upPath.slice(0,-1).forEach(id=>setCableColor(id, 0x3EC26E, true));
    setStatus('📤', labelOf(srcId)+' → '+CENTER.label, 'Sending data...');
    animatePath(upPath, ()=>{
    setCableColor(destId, 0xE04444, false);
    setStatus('🚫','Blocked!', CONFIG.blockedLine || (labelOf(destId)+' is blocked.'));
    speak(CONFIG.blockedLine || 'This destination is blocked by the rules — the connection is rejected.');
    });
    return;
    }
    const path = getFullPath(srcId, destId);
    path.slice(0,-1).forEach((id, i)=>{
    const hopId = connectTargetOf(id) === path[i+1] ? id : path[i+1];
    if (hopId !== '__center__') setCableColor(hopId, 0x3EC26E, true);
    });
    setStatus('📤', labelOf(srcId)+' → '+labelOf(destId), 'Sending data...');
    speak(CONFIG.deliverLine || ('The '+CENTER.label+' checks its rules and allows this traffic through.'));
    animatePath(path, ()=>{
    const deliveredLine = CONFIG.deliveredLine || (labelOf(srcId)+' → '+labelOf(destId)+' delivered.');
    setStatus('✅','Delivered!', deliveredLine);
    });
    }

    function handleSimTap(x, y){
    const id = findNearbyDevice(x, y);
    if (!id || id === '__center__') return;

    if (CONFIG.simMode === 'broadcast'){ sendBroadcast(id); return; }
    if (CONFIG.simMode === 'single'){ sendSingle(); return; }

    // 'selective' and 'hierarchy' both use pick-source-then-destination
    if (!simSource){
    simSource = id;
    setStatus('👆', labelOf(id)+' selected', 'Now tap another device to send data to.');
    speak(labelOf(id)+' '+(CONFIG.selectSourceLine || 'selected. Now tap another device to send data to.'));
    return;
    }
    if (id === simSource) return;
    const src = simSource, dest = id;
    simSource = null;
    if (CONFIG.simMode === 'hierarchy') sendHierarchy(src, dest);
    else sendSelective(src, dest);
    }

    // ─── HIT DETECTION — simple 2D screen-space proximity, not 3D raycasting.
    function projectToScreen(worldPos){
    const v = worldPos.clone().project(camera);
    return { x:(v.x+1)/2*uiCanvas.width, y:(-v.y+1)/2*uiCanvas.height };
    }
    function findNearbyDevice(xPix, yPix){
    const maxDist = 220;
    let closestId = null, closestDist = Infinity;
    for (const id in models){
    const worldPos = groups[id].getWorldPosition(new THREE.Vector3());
    const screenPos = projectToScreen(worldPos);
    const dist = Math.hypot(xPix-screenPos.x, yPix-screenPos.y);
    if (dist < maxDist && dist < closestDist){ closestDist = dist; closestId = id; }
    }
    return closestId;
    }

    // ─── TOUCH INPUT ──────────────────────────────────────────────────────────────
    const uiCanvas = document.getElementById('uiCanvas');
    uiCanvas.width = innerWidth; uiCanvas.height = innerHeight;

    function cp(e){
    const r = uiCanvas.getBoundingClientRect();
    const s = e.touches?e.touches[0]:e.changedTouches?e.changedTouches[0]:e;
    return { x:(s.clientX-r.left)*(uiCanvas.width/r.width), y:(s.clientY-r.top)*(uiCanvas.height/r.height) };
    }
    function touchDist(t1,t2){ return Math.hypot(t1.clientX-t2.clientX, t1.clientY-t2.clientY); }
    function touchAngle(t1,t2){ return Math.atan2(t2.clientY-t1.clientY, t2.clientX-t1.clientX); }

    uiCanvas.addEventListener('touchstart', e=>{
    e.preventDefault();
    if (step > SECONDARY.length) return;
    if (e.touches.length >= 2){
    const g = groups[currentId()];
    pinchStartDist = touchDist(e.touches[0], e.touches[1]);
    pinchStartScale = g.scale.x;
    pinchStartAngle = touchAngle(e.touches[0], e.touches[1]);
    pinchStartRotY = THREE.MathUtils.radToDeg(g.rotation.y);
    }
    }, {passive:false});

    uiCanvas.addEventListener('touchmove', e=>{
    e.preventDefault();
    if (step > SECONDARY.length) return;
    if (e.touches.length >= 2 && pinchStartDist != null){
    const g = groups[currentId()];
    const dist = touchDist(e.touches[0], e.touches[1]);
    const scale = Math.min(2.5, Math.max(0.4, pinchStartScale*(dist/pinchStartDist)));
    g.scale.setScalar(scale);
    const angle = touchAngle(e.touches[0], e.touches[1]);
    const rotY = pinchStartRotY + THREE.MathUtils.radToDeg(angle - pinchStartAngle);
    g.rotation.y = THREE.MathUtils.degToRad(rotY);
    }
    }, {passive:false});

    uiCanvas.addEventListener('touchend', e=>{
    e.preventDefault();
    const {x,y} = cp(e);
    if (pinchStartDist != null){ pinchStartDist = null; return; }
    if (step > SECONDARY.length){ handleSimTap(x,y); }
    }, {passive:false});

    // ─── RENDER LOOP ──────────────────────────────────────────────────────────────
    function animate(){
    requestAnimationFrame(animate);
    renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', ()=>{
    camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
    uiCanvas.width = innerWidth; uiCanvas.height = innerHeight;
    });
</script>
</body>
</html>
