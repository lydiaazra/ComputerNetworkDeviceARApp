<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Gateway Lab</title>
    <style>
        *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
        html,body{width:100%;height:100%;overflow:hidden;background:#0D1117;font-family:system-ui,sans-serif}
        body{display:flex;flex-direction:column}
        .topbar{background:#161B22;padding:10px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #21262D;flex-shrink:0}
        .back-btn{background:#21262D;border:none;color:#7EDCFF;font-size:13px;padding:6px 14px;border-radius:8px;cursor:pointer}
        .title{color:#fff;font-size:14px;font-weight:600;flex:1}
        .mode-btn{background:#1F6FEB;border:none;color:#fff;font-size:12px;padding:6px 12px;border-radius:8px;cursor:pointer}
        .toolbar{background:#161B22;border-bottom:1px solid #21262D;padding:8px 12px;display:flex;gap:8px;align-items:center;flex-shrink:0;overflow-x:auto}
        .tb-label{color:#8FA5C3;font-size:10px;font-weight:600;white-space:nowrap}
        .chip{background:#21262D;border:1px solid #30363D;border-radius:8px;padding:6px 12px;color:#C9D1D9;font-size:11px;cursor:pointer;display:flex;align-items:center;gap:5px;flex-shrink:0}
        .chip:active{background:#388BFD22;border-color:#1F6FEB}
        .canvas-wrap{flex:1;position:relative;overflow:hidden}
        #canvas{display:block;touch-action:none}
        .hint{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none}
        .hint-icon{font-size:36px;margin-bottom:8px}
        .hint-text{color:#8FA5C3;font-size:13px}
        .info-bar{background:#161B22;border-top:1px solid #21262D;padding:10px 14px;display:flex;align-items:center;gap:10px;flex-shrink:0}
        .info-icon{font-size:20px}
        .info-text{flex:1}
        .info-title{color:#fff;font-size:12px;font-weight:600;margin-bottom:2px}
        .info-sub{color:#8FA5C3;font-size:11px;line-height:1.4}
    </style>
</head>
<body>
<div class="topbar" id="topbar">
    <button class="back-btn" onclick="goBack()">← Back</button>
    <span class="title">🌐 Gateway — Interactive Lab</span>
    <button class="mode-btn" onclick="loadDemo()">Demo</button>
</div>
<div class="toolbar" id="toolbar">
    <span class="tb-label">ADD:</span>
    <div class="chip" onclick="addDevice('internet')">☁️ Internet</div>
    <div class="chip" onclick="addDevice('gateway')">🧱 Gateway</div>
    <div class="chip" onclick="addDevice('switch')">🔌 Switch</div>
    <div class="chip" onclick="addDevice('server')">🖥️ Server</div>
    <div class="chip" onclick="addDevice('pc')">💻 PC</div>
    <div class="chip" onclick="clearAll()">🗑️ Clear</div>
</div>
<div class="canvas-wrap" id="wrap">
    <canvas id="canvas"></canvas>
    <div class="hint" id="hint">
        <div class="hint-icon">🌐</div>
        <div class="hint-text">Tap "Demo" to see how a Gateway works<br>or add devices manually</div>
    </div>
</div>
<div class="info-bar" id="infobar">
    <span class="info-icon" id="infoIcon">🌐</span>
    <div class="info-text">
        <div class="info-title" id="infoTitle">Gateway Lab</div>
        <div class="info-sub"  id="infoSub">Tap a device to learn. Tap two to connect. Long-press to delete.</div>
    </div>
</div>

<script>
    const canvas=document.getElementById('canvas');
    const ctx=canvas.getContext('2d');
    const SC=1.6;

    // ── Resize canvas to fill wrap exactly ────────────────────────────────────
    function resize(){
      const totalH   = window.innerHeight;
      const topH     = document.getElementById('topbar').getBoundingClientRect().height;
      const toolH    = document.getElementById('toolbar').getBoundingClientRect().height;
      const infoH    = document.getElementById('infobar').getBoundingClientRect().height;
      canvas.width   = window.innerWidth;
      canvas.height  = Math.max(100, totalH - topH - toolH - infoH);
      draw();
    }

    // ── Device definitions ────────────────────────────────────────────────────
    const DEFS={
      internet:{ label:'Internet',    color:'#58A6FF', info:'The global network. External traffic originates here.' },
      gateway: { label:'Gateway',     color:'#F85149', info:'Translates protocols between LAN and the Internet.' },
      switch:  { label:'Switch',      color:'#3EC26E', info:'Distributes data within the internal network by MAC address.' },
      server:  { label:'Web Server',  color:'#388BFD', info:'Hosts services accessible to internal devices.' },
      pc:      { label:'Workstation', color:'#7EDCFF', info:'End-user device. Reaches internet through the gateway.' }
    };

    // ── Draw helpers ──────────────────────────────────────────────────────────
    function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.arcTo(x+w,y,x+w,y+r,r);c.lineTo(x+w,y+h-r);c.arcTo(x+w,y+h,x+w-r,y+h,r);c.lineTo(x+r,y+h);c.arcTo(x,y+h,x,y+h-r,r);c.lineTo(x,y+r);c.arcTo(x,y,x+r,y,r);c.closePath();}

    function drawDev(d){
      ctx.save();ctx.translate(d.x,d.y);ctx.scale(SC,SC);
      switch(d.type){
        case 'internet':
          ctx.fillStyle='#E8EDF2';
          ctx.beginPath();ctx.arc(-14,-6,14,0,Math.PI*2);ctx.arc(4,-10,16,0,Math.PI*2);
          ctx.arc(18,-4,12,0,Math.PI*2);ctx.arc(0,4,10,0,Math.PI*2);ctx.arc(-18,2,10,0,Math.PI*2);ctx.fill();
          ctx.fillStyle='#1A2744';ctx.font='bold 8px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('Internet',2,-2);
          break;
        case 'gateway':
          ctx.fillStyle='#8B0000';rr(ctx,-20,-28,40,56,3);ctx.fill();
          ctx.fillStyle='#F85149';rr(ctx,-18,-26,36,52,2);ctx.fill();
          ctx.fillStyle='#8B0000';
          for(let row=-3;row<=2;row++){const off=(row%2===0)?0:8;for(let col=-1;col<=1;col++){const bx=-18+col*16+off,by=row*8-4;if(bx>=-18&&bx+15<=18){rr(ctx,bx,by,15,7,1);ctx.fill();}}}
          break;
        case 'switch':
          ctx.fillStyle='#0D2010';rr(ctx,-30,-11,60,22,3);ctx.fill();
          ctx.fillStyle='#2A6B20';rr(ctx,-28,-9,56,18,2);ctx.fill();
          for(let i=0;i<8;i++){ctx.fillStyle='#0D1A0D';rr(ctx,-24+i*6.5,-5,5.5,5,1);ctx.fill();ctx.fillStyle=i<5?'#00FF88':'#333';ctx.beginPath();ctx.arc(-21.5+i*6.5,-2.5,1.5,0,Math.PI*2);ctx.fill();}
          break;
        case 'server':
          ctx.fillStyle='#0D2040';rr(ctx,-15,-28,30,56,3);ctx.fill();
          ctx.fillStyle='#1A4A8A';rr(ctx,-13,-26,26,52,2);ctx.fill();
          for(let i=0;i<5;i++){ctx.fillStyle='#0A2040';rr(ctx,-11,-22+i*10,22,8,1.5);ctx.fill();ctx.fillStyle='#40C0FF';ctx.beginPath();ctx.arc(6,-18+i*10,2,0,Math.PI*2);ctx.fill();ctx.fillStyle='#00FF88';ctx.beginPath();ctx.arc(10,-18+i*10,2,0,Math.PI*2);ctx.fill();}
          break;
        case 'pc':
          ctx.fillStyle='#1A2060';rr(ctx,-20,-24,40,30,3);ctx.fill();
          ctx.fillStyle='#4A6AE0';rr(ctx,-17,-21,34,23,2);ctx.fill();
          ctx.fillStyle='rgba(120,160,255,0.5)';for(let i=0;i<3;i++){rr(ctx,-12,-17+i*7,24,4,1);ctx.fill();}
          ctx.fillStyle='#1A2060';rr(ctx,-3,6,6,6,1);ctx.fill();rr(ctx,-10,12,20,4,2);ctx.fill();
          break;
      }
      ctx.restore();
    }

    const HIT=36*SC*0.65;

    function drawCable(a,b){
      const dx=b.x-a.x,dy=b.y-a.y,len=Math.sqrt(dx*dx+dy*dy);if(len<1)return;
      const ux=dx/len,uy=dy/len,g=HIT*0.88;
      const ax=a.x+ux*g,ay=a.y+uy*g,bx=b.x-ux*g,by=b.y-uy*g;
      ctx.save();ctx.strokeStyle='#388BFD';ctx.lineWidth=2.5;
      ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(bx,by);ctx.stroke();
      const hl=10,hw=5,ex=bx-ux*hl,ey=by-uy*hl;
      ctx.fillStyle='#388BFD';ctx.beginPath();ctx.moveTo(bx,by);ctx.lineTo(ex-uy*hw,ey+ux*hw);ctx.lineTo(ex+uy*hw,ey-ux*hw);ctx.closePath();ctx.fill();
      ctx.restore();
    }

    function pktCol(a,b){const t=[a.type,b.type];if(t.includes('internet')&&t.includes('gateway'))return'#FF6B6B';if(t.includes('gateway')&&t.includes('switch'))return'#FFB300';return'#00FF88';}
    function lbl(a,b){const t=[a.type,b.type];if(t.includes('internet')&&t.includes('gateway'))return{txt:'WAN Traffic',col:'#FF6B6B'};if(t.includes('gateway')&&t.includes('switch'))return{txt:'Protocol Translation',col:'#FFB300'};return{txt:'LAN',col:'#00FF88'};}

    // ─── State ────────────────────────────────────────────────────────────────
    let devices=[],cables=[],selected=null,dragging=null,dragOx=0,dragOy=0,dragMoved=false,longTimer=null,nextId=1,animT=0;

    function draw(){
      if(!canvas.width||!canvas.height)return;
      const W=canvas.width,H=canvas.height;
      ctx.clearRect(0,0,W,H);
      ctx.fillStyle='rgba(100,140,200,0.07)';
      for(let x=24;x<W;x+=32)for(let y=24;y<H;y+=32){ctx.beginPath();ctx.arc(x,y,1.5,0,Math.PI*2);ctx.fill();}

      cables.forEach(c=>{
        const a=devices.find(d=>d.id===c.a),b=devices.find(d=>d.id===c.b);if(!a||!b)return;
        drawCable(a,b);
        [0,0.5].forEach((off,i)=>{
          const p=(animT*0.22+off)%1;
          const px=a.x+(b.x-a.x)*p,py=a.y+(b.y-a.y)*p;
          ctx.beginPath();ctx.arc(px,py,i===0?6:4,0,Math.PI*2);
          ctx.fillStyle=pktCol(a,b)+(i===0?'':'88');ctx.fill();
          ctx.strokeStyle='rgba(255,255,255,0.6)';ctx.lineWidth=1.5;ctx.stroke();
        });
        const mx=(a.x+b.x)/2,my=(a.y+b.y)/2-40;
        const{txt,col}=lbl(a,b);
        ctx.save();ctx.font='bold 10px system-ui';ctx.textAlign='center';
        const tw=ctx.measureText(txt).width;
        ctx.fillStyle='rgba(13,17,23,0.92)';rr(ctx,mx-tw/2-8,my-11,tw+16,22,6);ctx.fill();
        ctx.strokeStyle=col;ctx.lineWidth=1;ctx.stroke();
        ctx.fillStyle=col;ctx.textBaseline='middle';ctx.fillText(txt,mx,my);
        ctx.restore();
      });

      devices.forEach(d=>{
        const def=DEFS[d.type],isSel=selected&&selected.id===d.id;
        if(isSel){ctx.save();ctx.strokeStyle=def.color;ctx.lineWidth=2.5;ctx.setLineDash([5,3]);ctx.beginPath();ctx.arc(d.x,d.y,HIT+8,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);ctx.restore();}
        ctx.save();ctx.shadowColor='rgba(0,0,0,0.35)';ctx.shadowBlur=14;ctx.shadowOffsetY=5;
        drawDev(d);ctx.restore();
        const ly=d.y+HIT*0.78;
        ctx.font='bold 11px system-ui';ctx.textAlign='center';
        const tw=ctx.measureText(def.label).width;
        ctx.fillStyle='rgba(13,17,23,0.92)';rr(ctx,d.x-tw/2-6,ly-9,tw+12,18,3);ctx.fill();
        ctx.strokeStyle=isSel?def.color:'#30363D';ctx.lineWidth=1;ctx.stroke();
        ctx.fillStyle=isSel?def.color:'#C9D1D9';ctx.textBaseline='middle';ctx.fillText(def.label,d.x,ly);
      });
    }

    function animate(){animT+=0.04;if(devices.length>0)draw();requestAnimationFrame(animate);}
    animate();

    function cp(e){const r=canvas.getBoundingClientRect(),s=e.touches?e.touches[0]:e;return{x:(s.clientX-r.left)*(canvas.width/r.width),y:(s.clientY-r.top)*(canvas.height/r.height)};}
    function hit(x,y){return devices.find(d=>Math.hypot(x-d.x,y-d.y)<HIT);}
    function onDown(e){const{x,y}=cp(e);dragMoved=false;const d=hit(x,y);if(d){dragging=d;dragOx=x-d.x;dragOy=y-d.y;longTimer=setTimeout(()=>{if(!dragMoved)del(d);},700);}}
    function onMove(e){e.preventDefault();if(!dragging)return;const{x,y}=cp(e);if(Math.abs(x-(dragging.x+dragOx))>5||Math.abs(y-(dragging.y+dragOy))>5)dragMoved=true;dragging.x=x-dragOx;dragging.y=y-dragOy;draw();}
    function onUp(e){clearTimeout(longTimer);if(dragging&&!dragMoved){const{x,y}=cp(e);tap(x,y);}dragging=null;dragMoved=false;}
    canvas.addEventListener('mousedown',onDown);canvas.addEventListener('mousemove',onMove);canvas.addEventListener('mouseup',onUp);
    canvas.addEventListener('touchstart',e=>{e.preventDefault();onDown(e);},{passive:false});
    canvas.addEventListener('touchmove',e=>{e.preventDefault();onMove(e);},{passive:false});
    canvas.addEventListener('touchend',e=>{e.preventDefault();onUp(e);},{passive:false});

    function tap(x,y){
      const d=hit(x,y);
      if(d){
        if(selected&&selected.id!==d.id){
          if(!cables.find(c=>(c.a===selected.id&&c.b===d.id)||(c.b===selected.id&&c.a===d.id))){
            cables.push({a:selected.id,b:d.id});
            document.getElementById('hint').style.display='none';
            setInfo('🔗','Connected!',DEFS[selected.type].label+' ↔ '+DEFS[d.type].label);
          }
          selected=null;
        } else {
          selected=d;
          setInfo({internet:'☁️',gateway:'🧱',switch:'🔌',server:'🖥️',pc:'💻'}[d.type],DEFS[d.type].label,DEFS[d.type].info);
        }
      } else {
        selected=null;
        setInfo('🌐','Gateway Lab','Tap device to select. Tap another to connect. Long-press to delete.');
      }
      draw();
    }

    function del(d){devices=devices.filter(x=>x.id!==d.id);cables=cables.filter(c=>c.a!==d.id&&c.b!==d.id);if(selected&&selected.id===d.id)selected=null;draw();}
    function addDevice(type){document.getElementById('hint').style.display='none';devices.push({id:nextId++,type,x:canvas.width/2+(Math.random()-0.5)*80,y:canvas.height/2+(Math.random()-0.5)*60});draw();}

    function loadDemo(){
      clearAll();
      document.getElementById('hint').style.display='none';
      const W=canvas.width,H=canvas.height,cx=W/2,cy=H/2,dx=W*0.21;
      devices=[
        {id:nextId++,type:'internet',x:cx-dx*1.7,y:cy},
        {id:nextId++,type:'gateway', x:cx-dx*0.55,y:cy},
        {id:nextId++,type:'switch',  x:cx+dx*0.55,y:cy},
        {id:nextId++,type:'server',  x:cx+dx*1.7,y:cy-H*0.24},
        {id:nextId++,type:'pc',      x:cx+dx*1.7,y:cy},
        {id:nextId++,type:'pc',      x:cx+dx*1.7,y:cy+H*0.24},
      ];
      const ids=devices.map(d=>d.id);
      cables=[{a:ids[0],b:ids[1]},{a:ids[1],b:ids[2]},{a:ids[2],b:ids[3]},{a:ids[2],b:ids[4]},{a:ids[2],b:ids[5]}];
      setInfo('🌐','Gateway — Network Bridge','🔴 WAN → 🟡 Protocol translation → 🟢 LAN distribution');
      draw();
    }

    function clearAll(){devices=[];cables=[];selected=null;document.getElementById('hint').style.display='flex';setInfo('🌐','Gateway Lab','Tap Demo or add devices manually.');draw();}
    function setInfo(icon,title,sub){document.getElementById('infoIcon').textContent=icon;document.getElementById('infoTitle').textContent=title;document.getElementById('infoSub').textContent=sub;}
    function goBack(){if(window.AndroidBridge)AndroidBridge.goBack();else history.back();}

    window.addEventListener('resize',resize);
    // Wait for layout then size canvas
    window.addEventListener('load',()=>setTimeout(resize,200));
    setTimeout(resize,300);
</script>
</body>
</html>
