<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <style>
        *{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-tap-highlight-color:transparent;}
        html,body{width:100%;height:100%;overflow:hidden;background:transparent;}
        #threeCanvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:1;pointer-events:none;}
        #uiCanvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:2;touch-action:none;}
    </style>
</head>
<body>
<canvas id="threeCanvas"></canvas>
<canvas id="uiCanvas"></canvas>

<script src="three.min.js"></script>
<script src="GLTFLoader.js"></script>
<script>
    // ─── SCENARIOS ────────────────────────────────────────────────────────────────
    // mode: 'selective' | 'broadcast' | 'single'
    // 'selective' + blockedIds  -> Firewall-style rule rejection
    // 'single' + roundtrip:true -> Server-style request/response
    const SCENARIOS = {

    switch: {
    centerGlb:'switch.glb', centerLabel:'Switch', mode:'selective',
    nodes: [
    {id:'n1', glb:'pc.glb', label:'PC A', pos:[0,1.05,0]},
    {id:'n2', glb:'pc.glb', label:'PC E', pos:[-1.05,0.35,0]},
    {id:'n3', glb:'laptop.glb', label:'Laptop B', pos:[1.05,0.35,0]},
    {id:'n4', glb:'pc.glb', label:'PC D', pos:[-0.65,-0.95,0]},
    {id:'n5', glb:'pc.glb', label:'PC C', pos:[0.65,-0.95,0]},
    ],
    intro:'This is a Switch. Tap a PC to send data — pick a source, then a destination.',
    demoSrc:'n1', demoDest:'n2',
    demoLine:'The Switch knows exactly where PC E is, so it delivers the frame directly — not to everyone.',
    afterLine:'Unlike a Hub, which broadcasts to every device, the Switch only sends to the device that needs it — reducing unnecessary network traffic.'
    },

    hub: {
    centerGlb:'hub.glb', centerLabel:'Hub', mode:'broadcast',
    nodes: [
    {id:'n1', glb:'pc.glb', label:'PC A', pos:[0,1.05,0]},
    {id:'n2', glb:'pc.glb', label:'PC E', pos:[-1.05,0.35,0]},
    {id:'n3', glb:'laptop.glb', label:'Laptop B', pos:[1.05,0.35,0]},
    {id:'n4', glb:'pc.glb', label:'PC D', pos:[-0.65,-0.95,0]},
    {id:'n5', glb:'pc.glb', label:'PC C', pos:[0.65,-0.95,0]},
    ],
    intro:'This is a Hub. Tap any PC to send data — watch it reach every device.',
    demoSrc:'n1',
    demoLine:'The Hub doesn\'t check where data should go — it broadcasts to every device connected to it.',
    afterLine:'This creates more network traffic than necessary, which is why Switches replaced Hubs in most networks.'
    },

    router: {
    centerGlb:'router.glb', centerLabel:'Router', mode:'selective',
    nodes: [
    {id:'n1', glb:'modem.glb', label:'Modem', pos:[0,1.05,0]},
    {id:'n2', glb:'switch.glb', label:'Switch', pos:[-1.05,0.35,0]},
    {id:'n3', glb:'wap.glb', label:'WAP', pos:[1.05,0.35,0]},
    {id:'n4', glb:'pc.glb', label:'PC', pos:[0,-0.95,0]},
    ],
    intro:'This is a Router. Tap the Modem, then tap another device to route data between your network and the Internet.',
    demoSrc:'n1', demoDest:'n4',
    demoLine:'The Router reads the destination IP address and forwards data from the Internet to the correct device on your network.',
    afterLine:'Routers connect your entire local network to the Internet — this is how every device in your home gets online.'
    },
    // NOTE: Router is no longer used from here — it now has its own
    // dedicated file (router_flow_ar.html) with the drag-to-place +
    // connect + simulate flow. This entry is kept only as an unused
    // fallback in case AndroidBridge routing ever falls through to it.

    firewall: {
    centerGlb:'firewall.glb', centerLabel:'Firewall', mode:'selective',
    blockedIds:['n4','n5'],
    nodes: [
    {id:'n1', glb:'pc.glb', label:'Internal LAN PC', pos:[0,1.05,0]},
    {id:'n2', glb:'server.glb', label:'Allowed Website', pos:[-1.05,0.35,0]},
    {id:'n3', glb:'server.glb', label:'Allowed Website', pos:[1.05,0.35,0]},
    {id:'n4', glb:'server.glb', label:'Blocked Website', pos:[-0.65,-0.95,0]},
    {id:'n5', glb:'server.glb', label:'Blocked Website', pos:[0.65,-0.95,0]},
    ],
    intro:'This is a Firewall. Tap your PC, then tap a website on the Internet to see if it\'s allowed through.',
    demoSrc:'n1', demoDest:'n4',
    demoLine:'The Firewall checks this request against its security rules...',
    blockedLine:'This website is blocked by the Firewall\'s rules — the connection is rejected.',
    afterLine:'Firewalls sit between your internal network and the Internet, protecting your LAN by filtering traffic based on rules you define.'
    },

    repeater: {
    centerGlb:'repeater.glb', centerLabel:'Repeater', mode:'single',
    nodes: [
    {id:'src', glb:'pc.glb', label:'Source', pos:[-1.0,0,0]},
    {id:'dest', glb:'pc.glb', label:'Destination', pos:[1.0,0,0]},
    ],
    intro:'This is a Repeater. Tap it to see how it boosts a weak signal.',
    demoSrc:'src', demoDest:'dest',
    demoLine:'The signal weakens as it travels — the Repeater regenerates it...',
    afterLine:'This lets the signal travel much further than it could on its own.'
    },

    gateway: {
    centerGlb:'gateway.glb', centerLabel:'Gateway', mode:'single',
    nodes: [
    {id:'src', glb:'pc.glb', label:'LAN Network', pos:[-1.0,0,0]},
    {id:'dest', glb:'server.glb', label:'Internet / WAN', pos:[1.0,0,0]},
    ],
    intro:'This is a Gateway. Tap it to see how it translates between your LAN and the Internet.',
    demoSrc:'src', demoDest:'dest',
    demoLine:'The Gateway translates the data format so your local network and the Internet can understand each other.',
    afterLine:'Without a Gateway, your LAN and the wider Internet couldn\'t communicate directly — different networks often use different protocols.'
    },

    wap: {
    centerGlb:'wap.glb', centerLabel:'WAP', mode:'single',
    nodes: [
    {id:'src', glb:'laptop.glb', label:'Wireless Laptop', pos:[-1.0,0,0]},
    {id:'dest', glb:'pc.glb', label:'Wired Network', pos:[1.0,0,0]},
    ],
    intro:'This is a Wireless Access Point. Tap it to see how it bridges WiFi to the wired network.',
    demoSrc:'src', demoDest:'dest',
    demoLine:'The WAP receives the wireless signal and bridges it onto the wired network.',
    afterLine:'This is how your phone or laptop connects to the Internet without a cable.'
    },

    server: {
    centerGlb:'server.glb', centerLabel:'Server', mode:'single', roundtrip:true,
    nodes: [
    {id:'src', glb:'pc.glb', label:'Client PC', pos:[0,-1.0,0]},
    ],
    intro:'This is a Server. Tap the PC to send a request and watch the response come back.',
    demoSrc:'src',
    demoLine:'The PC sends a request to the Server...',
    processLine:'The Server processes the request...',
    afterLine:'The Server then sends the response back — this request-response cycle happens every time you load a webpage.'
    },

    };

    let scenario = SCENARIOS.switch;
    let awaitingSource = true;

    const threeCanvas = document.getElementById('threeCanvas');
    const renderer = new THREE.WebGLRenderer({canvas:threeCanvas,antialias:true,alpha:true});
    renderer.setClearColor(0x000000, 0);
    renderer.setPixelRatio(Math.min(devicePixelRatio,2));
    renderer.setSize(innerWidth, innerHeight);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.01, 100);
    camera.position.set(0, 0, 5.4);
    camera.lookAt(0, 0, 0);

    scene.add(new THREE.AmbientLight(0xffffff, 1.6));
    const key = new THREE.DirectionalLight(0xffffff, 1.0);
    key.position.set(2,4,3); scene.add(key);
    const fill = new THREE.DirectionalLight(0x7EDCFF, 0.4);
    fill.position.set(-3,0,-2); scene.add(fill);

    const pivot = new THREE.Group();
    pivot.position.y = 0.55;
    scene.add(pivot);

    let nodeGroups = {};
    let nodeModels = {};
    let cableCurves = {};
    let cableMeshes = {};

    // ─── LOADING ──────────────────────────────────────────────────────────────────
    let loadQueue = [];
    let currentLoadingId = null;

    function buildTopology(){
    // clear any previous scenario's objects
    Object.values(nodeGroups).forEach(g=>pivot.remove(g));
    nodeGroups = {}; nodeModels = {}; cableCurves = {}; cableMeshes = {};

    const centerPos = new THREE.Vector3(0,0,0);
    const centerGroup = new THREE.Group();
    centerGroup.position.copy(centerPos);
    pivot.add(centerGroup);
    nodeGroups['__center__'] = centerGroup;

    scenario.nodes.forEach(n=>{
    const g = new THREE.Group();
    g.position.set(n.pos[0], n.pos[1], n.pos[2]);
    pivot.add(g);
    nodeGroups[n.id] = g;
    });

    loadQueue = ['__center__'].concat(scenario.nodes.map(n=>n.id));
    loadNext();
    }

    function glbForId(id){
    return id === '__center__' ? scenario.centerGlb
         : scenario.nodes.find(n=>n.id===id).glb;
    }

    function loadNext(){
    if (loadQueue.length === 0) { onAllLoaded(); return; }
    const id = loadQueue.shift();
    currentLoadingId = id;
    if (window.AndroidBridge) AndroidBridge.requestGlb(glbForId(id));
    else { buildPlaceholder(id); loadNext(); }
    }

    window.onGlbReady = function(){
    const total = AndroidBridge.getGlbLength();
    const id = currentLoadingId;
    if (total === 0) { buildPlaceholder(id); loadNext(); return; }
    const chunks = []; let offset = 0;
    function fetchNext(){
    if (offset >= total){
    const b64 = chunks.join('');
    const binary = atob(b64);
    const buf = new ArrayBuffer(binary.length);
    const view = new Uint8Array(buf);
    for (let i=0;i<binary.length;i++) view[i]=binary.charCodeAt(i);
    new THREE.GLTFLoader().parse(buf,'',function(gltf){
    setNodeModel(id, gltf.scene); loadNext();
    }, function(){ buildPlaceholder(id); loadNext(); });
    return;
    }
    const chunk = AndroidBridge.getGlbChunk(offset);
    if (!chunk || chunk.length===0){ buildPlaceholder(id); loadNext(); return; }
    chunks.push(chunk); offset += chunk.length;
    setTimeout(fetchNext,0);
    }
    fetchNext();
    };

    function setNodeModel(id, model){
    const box = new THREE.Box3().setFromObject(model);
    const size = box.getSize(new THREE.Vector3());
    const ctr = box.getCenter(new THREE.Vector3());
    const target = id === '__center__' ? 1.05 : 0.28;
    const sc = target / Math.max(size.x, size.y, size.z);
    model.scale.setScalar(sc);
    model.position.sub(ctr.multiplyScalar(sc));
    nodeGroups[id].add(model);
    nodeModels[id] = model;
    }

    function buildPlaceholder(id){
    const isCenter = id === '__center__';
    const geo = isCenter ? new THREE.BoxGeometry(1.1,0.42,0.6) : new THREE.BoxGeometry(0.24,0.15,0.17);
    const mat = new THREE.MeshStandardMaterial({color: isCenter?0x2A6B20:0x4A6AE0});
    const mesh = new THREE.Mesh(geo, mat);
    nodeGroups[id].add(mesh);
    nodeModels[id] = mesh;
    }

    // ─── CABLES ───────────────────────────────────────────────────────────────────
    function buildCables(){
    scenario.nodes.forEach(n=>{
    const a = new THREE.Vector3(n.pos[0], n.pos[1], n.pos[2]);
    const b = new THREE.Vector3(0,0,0);
    const mid = a.clone().add(b).multiplyScalar(0.5);
    mid.y -= 0.05;
    const curve = new THREE.QuadraticBezierCurve3(a, mid, b);
    cableCurves[n.id] = curve;
    const geo = new THREE.TubeGeometry(curve, 16, 0.010, 8, false);
    const mat = new THREE.MeshStandardMaterial({color:0x3A4656, roughness:0.6});
    const tube = new THREE.Mesh(geo, mat);
    pivot.add(tube);
    cableMeshes[n.id] = tube;
    });
    }

    function setCableActive(id, active, blocked){
    const mesh = cableMeshes[id];
    if (!mesh) return;
    mesh.material.color.set(blocked ? 0x8A2A2A : (active ? 0x3EC26E : 0x3A4656));
    }
    function resetCables(){
    scenario.nodes.forEach(n=>setCableActive(n.id, false, false));
    }

    function onAllLoaded(){
    buildCables();
    resetInteractionState();
    if (window.AndroidBridge) AndroidBridge.onSceneReady();
    setStatus(iconFor(scenario), scenario.centerLabel, scenario.intro);
    speak(scenario.intro);
    }

    function iconFor(s){
    if (s === SCENARIOS.hub) return '📡';
    if (s === SCENARIOS.router) return '🔌';
    if (s === SCENARIOS.firewall) return '🛡️';
    if (s === SCENARIOS.repeater) return '🔁';
    if (s === SCENARIOS.gateway) return '🌐';
    if (s === SCENARIOS.wap) return '📶';
    if (s === SCENARIOS.server) return '🗄️';
    return '🔀';
    }

    function speak(text){
    if (window.AndroidBridge) AndroidBridge.speakAvatarLine(text);
    }
    function setStatus(icon, title, sub){
    if (window.AndroidBridge) AndroidBridge.setStatus(icon, title, sub);
    }

    // ─── PACKET ANIMATION ─────────────────────────────────────────────────────────
    let packetMesh = null;
    function ensurePacket(){
    if (packetMesh) return packetMesh;
    const geo = new THREE.SphereGeometry(0.045, 12, 12);
    const mat = new THREE.MeshBasicMaterial({color:0xFFD84A});
    packetMesh = new THREE.Mesh(geo, mat);
    packetMesh.visible = false;
    pivot.add(packetMesh);
    return packetMesh;
    }

    function animateAlongCurve(curve, reverse, duration, onDone){
    const mesh = ensurePacket();
    mesh.visible = true;
    const start = performance.now();
    function step(now){
    let t = (now - start) / duration;
    if (t > 1) t = 1;
    const tt = reverse ? (1 - t) : t;
    const p = curve.getPoint(tt);
    mesh.position.copy(p);
    if (t < 1) requestAnimationFrame(step);
    else { mesh.visible = false; onDone && onDone(); }
    }
    requestAnimationFrame(step);
    }

    function labelOf(id){
    if (id === '__center__') return scenario.centerLabel;
    const n = scenario.nodes.find(x=>x.id===id);
    return n ? n.label : id;
    }

    // ─── SELECTIVE MODE — pick source, then destination ─────────────────────────
    function sendSelective(sourceId, destId, isDemo){
    const blocked = (scenario.blockedIds||[]).includes(destId);
    const others = scenario.nodes.map(n=>n.id).filter(id=>id!==sourceId && id!==destId);
    resetCables();
    setCableActive(sourceId, true, false);
    others.forEach(id=>setCableActive(id, false, true));

    setStatus(iconFor(scenario), labelOf(sourceId)+' → '+scenario.centerLabel, 'Sending data...');
    animateAlongCurve(cableCurves[sourceId], false, 900, ()=>{
    if (blocked){
    setCableActive(destId, false, true);
    setStatus('🚫','Blocked!', scenario.blockedLine || (labelOf(destId)+' is blocked.'));
    if (isDemo) speak(scenario.blockedLine || 'This destination is blocked.');
    if (isDemo) setTimeout(onDemoFinished, 1600);
    else resetInteractionState();
    return;
    }
    setCableActive(destId, true, false);
    const midLine = scenario.demoLine;
    setStatus(iconFor(scenario), scenario.centerLabel+' forwards it', labelOf(sourceId)+' → '+scenario.centerLabel+' → '+labelOf(destId)+' only.');
    if (isDemo && midLine) speak(midLine);
    animateAlongCurve(cableCurves[destId], true, 900, ()=>{
    const blockedNames = others.map(labelOf).join(', ');
    setStatus('✅','Delivered!', labelOf(sourceId)+' → '+scenario.centerLabel+' → '+labelOf(destId)+' only.'+(others.length?(' '+blockedNames+' blocked.'):''));
    if (isDemo) setTimeout(onDemoFinished, 1400);
    else resetInteractionState();
    });
    });
    }

    // ─── BROADCAST MODE — one tap, reaches everyone ─────────────────────────────
    function sendBroadcast(sourceId, isDemo){
    const others = scenario.nodes.map(n=>n.id).filter(id=>id!==sourceId);
    resetCables();
    setCableActive(sourceId, true, false);
    setStatus(iconFor(scenario), labelOf(sourceId)+' → '+scenario.centerLabel, 'Sending data...');
    animateAlongCurve(cableCurves[sourceId], false, 900, ()=>{
    if (isDemo && scenario.demoLine) speak(scenario.demoLine);
    setStatus(iconFor(scenario), scenario.centerLabel+' broadcasts it', 'Sending to every connected device...');
    let done = 0;
    others.forEach(id=>{
    setCableActive(id, true, false);
    animateAlongCurve(cableCurves[id], true, 900, ()=>{
    done++;
    if (done === others.length){
    setStatus('✅','Delivered to everyone!', labelOf(sourceId)+' → '+scenario.centerLabel+' → all '+others.length+' devices.');
    if (isDemo) setTimeout(onDemoFinished, 1400);
    else resetInteractionState();
    }
    });
    });
    });
    }

    // ─── SINGLE MODE — one fixed concept (boost / translate / bridge / roundtrip) ──
    function sendSingle(isDemo){
    const src = scenario.demoSrc, dest = scenario.demoDest;
    resetCables();
    setCableActive(src, true, false);
    setStatus(iconFor(scenario), labelOf(src)+' → '+scenario.centerLabel, 'Sending data...');
    animateAlongCurve(cableCurves[src], false, 900, ()=>{
    if (isDemo && scenario.demoLine) speak(scenario.demoLine);
    setStatus(iconFor(scenario), scenario.centerLabel, scenario.demoLine || '');

    if (scenario.roundtrip){
    setTimeout(()=>{
    if (isDemo && scenario.processLine) speak(scenario.processLine);
    setStatus(iconFor(scenario), 'Processing...', scenario.processLine || '');
    setTimeout(()=>{
    setCableActive(src, true, false);
    animateAlongCurve(cableCurves[src], false, 900, ()=>{
    setStatus('✅','Response delivered!', scenario.centerLabel+' → '+labelOf(src));
    if (isDemo) setTimeout(onDemoFinished, 1400);
    else resetInteractionState();
    });
    }, 900);
    }, 500);
    return;
    }

    if (!dest){
    setStatus('✅','Done!', scenario.demoLine || '');
    if (isDemo) setTimeout(onDemoFinished, 1400);
    else resetInteractionState();
    return;
    }

    setCableActive(dest, true, false);
    animateAlongCurve(cableCurves[dest], true, 900, ()=>{
    setStatus('✅','Delivered!', labelOf(src)+' → '+scenario.centerLabel+' → '+labelOf(dest)+'.');
    if (isDemo) setTimeout(onDemoFinished, 1400);
    else resetInteractionState();
    });
    });
    }

    // ─── DEMO MODE ────────────────────────────────────────────────────────────────
    let isDemoMode = false;
    window.onDemoModeToggle = function(){
    if (isDemoMode) return;
    isDemoMode = true;
    resetCables();
    setStatus('🎬','Demo', 'Watch how '+scenario.centerLabel+' handles data.');
    setTimeout(()=>{
    if (scenario.mode === 'broadcast') sendBroadcast(scenario.demoSrc, true);
    else sendSelective(scenario.demoSrc, scenario.demoDest, true);
    if (scenario.mode === 'single') sendSingle(true);
    }, 1400);
    };

    function onDemoFinished(){
    if (scenario.afterLine) speak(scenario.afterLine);
    setTimeout(()=>{
    isDemoMode = false;
    resetCables();
    resetInteractionState();
    setStatus(iconFor(scenario), 'Now you try', scenario.intro);
    speak('Now it\'s your turn. ' + scenario.intro);
    }, 3200);
    }

    function resetInteractionState(){
    awaitingSource = true;
    window.__selectedSource = null;
    }

    // ─── TRY MODE — tap-based interaction ────────────────────────────────────────
    const raycaster = new THREE.Raycaster();
    function raycastHit(xPix, yPix){
    const mouse = new THREE.Vector2((xPix/uiCanvas.width)*2-1, -(yPix/uiCanvas.height)*2+1);
    raycaster.setFromCamera(mouse, camera);
    const meshes = Object.values(nodeModels);
    const hits = raycaster.intersectObjects(meshes, true);
    return hits.length ? hits[0] : null;
    }
    function nodeIdForObject(obj){
    let o = obj;
    while (o){
    for (const id in nodeModels){ if (nodeModels[id] === o) return id; }
    o = o.parent;
    }
    return null;
    }

    const uiCanvas = document.getElementById('uiCanvas');
    uiCanvas.width = innerWidth; uiCanvas.height = innerHeight;

    function cp(e){
    const r = uiCanvas.getBoundingClientRect();
    const s = e.changedTouches ? e.changedTouches[0] : e;
    return { x:(s.clientX-r.left)*(uiCanvas.width/r.width), y:(s.clientY-r.top)*(uiCanvas.height/r.height) };
    }

    uiCanvas.addEventListener('touchend', e=>{
    e.preventDefault();

    if (isDemoMode) return;
    const {x,y} = cp(e);
    const hit = raycastHit(x,y);
    if (!hit) return;
    const id = nodeIdForObject(hit.object);
    if (!id || id === '__center__') return;

    if (scenario.mode === 'single'){
    sendSingle(false);
    return;
    }

    if (scenario.mode === 'broadcast'){
    sendBroadcast(id, false);
    return;
    }

    // selective
    if (awaitingSource){
    window.__selectedSource = id;
    awaitingSource = false;
    resetCables();
    setCableActive(id, true, false);
    setStatus('👆', labelOf(id)+' selected', 'Now tap the destination.');
    speak(labelOf(id)+' selected. Now tap the destination.');
    return;
    }
    if (id === window.__selectedSource) return;
    const src = window.__selectedSource;
    awaitingSource = true;
    sendSelective(src, id, false);
    }, {passive:false});

    // ─── RENDER LOOP ──────────────────────────────────────────────────────────────
    function animate(){
    requestAnimationFrame(animate);
    renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', ()=>{
    camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
    uiCanvas.width = innerWidth; uiCanvas.height = innerHeight;
    });

    // ─── ENTRY POINT — Android calls this once, right after page load ───────────
    window.initDeviceType = function(deviceType){
    var attempts = 0;
    (function tryInit(){
    if (typeof THREE !== 'undefined' && THREE.GLTFLoader){
    scenario = SCENARIOS[deviceType] || SCENARIOS.switch;
    buildTopology();
    } else if (attempts++ < 30){ setTimeout(tryInit, 200); }
    })();
    };
</script>
</body>
</html>
